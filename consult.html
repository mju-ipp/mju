<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>1:1 상담 · 일학습병행 앱</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#fafaf8" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./student.css" /><!-- 학생 화면 디자인(관리자와 같은 계열) -->
  <script src="./config.js"></script>
  <style>
    .msg{max-width:80%;padding:10px 13px;border-radius:14px;margin:6px 0;font-size:15px;white-space:pre-wrap}
    .msg.student{background:var(--brand);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
    .msg.admin{background:var(--surface-card);border:1px solid var(--line);margin-right:auto;border-bottom-left-radius:4px}
    .msg .t{display:block;font-size:12px;opacity:.7;margin-top:3px}
  </style>
</head>
<body>
  <div class="app">
    <header class="ph-header">
      <img class="wm" src="./assets/logo-mono-white.png" alt="" />
      <div class="ph-lockup"><img src="./assets/logo-mono-white.png" alt="" /><span>일학습병행 공동훈련센터</span></div>
      <div class="ph-title-row"><a class="ph-back" href="./index.html" aria-label="뒤로"><i data-lucide="chevron-left"></i></a><h1 class="ph-title">1:1 상담</h1></div>
      <p class="ph-sub" id="sub">담당자와 비공개로 대화해요</p>
      <hr class="ph-gold" />
    </header>

    <main class="ph-body">

      <!-- 신규 상담 신청 -->
      <div class="card accent" id="newForm" style="display:none">
        <p class="ph-card-title">상담 신청</p>
        <p class="ph-note">담당자에게는 회원님의 <b>이름과 직무가 함께 보입니다</b>(정확한 지원을 위해).</p>
        <span class="field-label">상담 내용 <span class="req">*</span></span>
        <textarea id="firstMsg" class="ph-ta" rows="4" placeholder="상담 내용을 입력하세요"></textarea>
        <button class="mju-btn mju-btn--full" id="create">상담 신청하기</button>
        <div class="status" id="cStatus"></div>
      </div>

      <!-- 진행 중 상담 -->
      <div id="thread" style="display:none">
        <div class="card" id="msgs" style="display:flex;flex-direction:column"></div>
        <div class="card">
          <span class="field-label">메시지</span>
          <textarea id="reply" class="ph-ta" rows="2" placeholder="메시지 입력"></textarea>
          <button class="mju-btn mju-btn--full" id="send">보내기</button>
          <div class="status" id="rStatus"></div>
          <p class="ph-note"><a href="#" id="newOne">새 상담 시작</a> · 답변이 오면 새로고침하면 보여요</p>
        </div>
      </div>

      <a href="./index.html" class="mju-btn mju-btn--secondary mju-btn--full" style="margin-top:auto">홈으로</a>
    </main>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script type="module">
    import { supabase, configReady, setStatus, friendlyError } from './app.js';

    if (window.lucide) window.lucide.createIcons();

    const $ = id => document.getElementById(id);
    const esc = (s) => { const e = document.createElement('div'); e.textContent = s || ''; return e.innerHTML; };
    const KEY = 'ilhak_consult_id';

    let profile = {};
    try { profile = JSON.parse(localStorage.getItem('ilhak_profile') || '{}'); } catch (_) {}

    function showNew() { $('newForm').style.display = 'block'; $('thread').style.display = 'none'; }
    function showThread() { $('newForm').style.display = 'none'; $('thread').style.display = 'block'; }

    async function loadThread() {
      let id = null; try { id = localStorage.getItem(KEY); } catch (_) {}
      if (!id) { showNew(); return; }
      if (!configReady()) { showThread(); $('sub').textContent = '연결 설정이 필요해요.'; return; }
      let data = null, error = null;
      try { ({ data, error } = await supabase.rpc('get_consultation', { p_id: id })); } catch (e) { error = e; }
      // (10/23 점검) 연결 오류면 상담 번호를 지우지 않음(지우면 그 대화로 다시 못 돌아옴) — 서버가 '없음'이라고 할 때만 새로
      if (error) { showThread(); $('sub').textContent = '불러오지 못했어요 — 연결을 확인하고 다시 열어 주세요.'; return; }
      if (!data) { try { localStorage.removeItem(KEY); } catch (_) {} showNew(); return; }
      showThread();
      $('sub').textContent = '상태: ' + (data.status || '열림');
      const box = $('msgs'); box.innerHTML = '';
      (data.messages || []).forEach(m => {
        const div = document.createElement('div'); div.className = 'msg ' + (m.sender === 'admin' ? 'admin' : 'student');
        div.innerHTML = esc(m.text) + `<span class="t">${m.sender === 'admin' ? '담당자' : '나'} · ${new Date(m.at).toLocaleString('ko-KR', { dateStyle: 'short', timeStyle: 'short' })}</span>`;
        box.appendChild(div);
      });
      box.scrollTop = box.scrollHeight;
    }

    $('create').addEventListener('click', async () => {
      const msg = $('firstMsg').value.trim();
      if (!msg) { setStatus($('cStatus'), '내용을 입력해주세요.', 'error'); return; }
      if (!configReady()) { setStatus($('cStatus'), 'Supabase 연결이 필요합니다.', 'error'); return; }
      $('create').disabled = true; setStatus($('cStatus'), '신청 중...', 'info');
      const { data, error } = await supabase.rpc('create_consultation', { p_name: profile.name || null, p_job: profile.job_key || null, p_message: msg });
      $('create').disabled = false;
      if (error || !data) { setStatus($('cStatus'), friendlyError(error), 'error'); return; }
      localStorage.setItem(KEY, data); $('firstMsg').value = ''; loadThread();
    });

    $('send').addEventListener('click', async () => {
      const text = $('reply').value.trim(); const id = localStorage.getItem(KEY);
      if (!text || !id) return;
      $('send').disabled = true;
      const { error } = await supabase.rpc('add_consultation_message', { p_id: id, p_text: text });
      $('send').disabled = false;
      if (error) { setStatus($('rStatus'), friendlyError(error), 'error'); return; }
      $('reply').value = ''; loadThread();
    });

    $('newOne').addEventListener('click', (e) => { e.preventDefault(); if (confirm('새 상담을 시작할까요? (기존 상담은 담당자에게 남아있어요)')) { localStorage.removeItem(KEY); showNew(); } });

    loadThread();
  </script>
</body>
</html>
