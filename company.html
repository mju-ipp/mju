<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>우리 학생 OJT · 일학습병행 앱</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#121318" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./student.css" /><!-- 학생 화면 디자인(관리자와 같은 계열) — 토큰 --v-* -->
  <script src="./config.js"></script>
  <style>
    /* 기업 담당자 페이지(docs/FIELD.md 시안 v2) — 먹색 머리 + 코발트 하나 + 모자람·미신청만 warn, 1px 선 */
    body{background:var(--v-bg)}
    .fh{background:var(--v-head); color:#fff; padding:20px 16px 18px}
    .fh .in,.ft-in,.fw{max-width:560px; margin:0 auto}
    .fh .co{margin:0; font-size:13px; color:var(--v-mute-on-ink)}
    .fh .back{display:inline-block; margin:0 0 8px; padding:4px 0; font-size:13px; color:var(--v-mute-on-ink); text-decoration:none}
    .fh h1{margin:4px 0 0; font-size:22px; font-weight:700; line-height:1.35; color:#fff}
    .fh .sum{margin:10px 0 0; display:flex; gap:18px; flex-wrap:wrap}
    .fh .sum div{font-size:13px; color:var(--v-mute-on-ink)}
    .fh .sum b{display:block; font-size:22px; font-weight:500; color:#fff}
    .fh .sum b.w{color:#f0a07a}
    .ftabs{position:sticky; top:0; z-index:2; background:var(--v-bg); border-bottom:1px solid var(--v-line)}
    .ft-in{display:flex; overflow-x:auto}
    .ftabs button{flex:1 0 auto; min-height:48px; padding:0 12px; border:0; background:none; font:inherit; font-size:14px; font-weight:500; color:var(--v-mute); cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap}
    .ftabs button[aria-selected="true"]{color:var(--v-ink); border-bottom-color:var(--v-cobalt)}
    .ftabs .dot{display:inline-block; min-width:18px; margin-left:4px; padding:0 5px; border-radius:9px; font-size:12px; line-height:18px; background:var(--v-warn-bg); color:var(--v-warn)}
    .fw{padding:0 16px 96px}
    .fw section[hidden]{display:none}
    .fw h2{margin:24px 0 4px; font-size:16px; font-weight:700; color:var(--v-ink)}
    .lede{margin:0 0 10px; font-size:13px; line-height:1.5; color:var(--v-mute)}
    .mnav{display:flex; align-items:center; justify-content:space-between; margin:20px 0 6px}
    .mnav b{font-size:16px; color:var(--v-ink)}
    .mnav button{min-width:44px; min-height:40px; border:1px solid var(--v-line); border-radius:6px; background:var(--v-paper); color:var(--v-ink); font-size:16px; cursor:pointer}
    .mnav button:disabled{opacity:.4; cursor:default}
    .btn{min-height:44px; padding:0 16px; border:1px solid var(--v-cobalt); border-radius:8px; background:var(--v-paper); color:var(--v-cobalt); font:inherit; font-size:15px; font-weight:500; cursor:pointer}
    .btn.solid{background:var(--v-cobalt); color:#fff}
    .btn.wide{width:100%}
    .btn:disabled{opacity:.5; cursor:default}
    .lnk{flex:none; min-height:36px; padding:0 10px; border:0; background:none; color:var(--v-cobalt); font:inherit; font-size:13px; font-weight:500; cursor:pointer}
    .box{margin:16px 0 0; border:1px solid var(--v-line); border-radius:10px; background:var(--v-paper)}
    .box-h{display:flex; align-items:baseline; justify-content:space-between; gap:8px; padding:12px 14px; border-bottom:1px solid var(--v-line)}
    .box-h b{font-size:15px; color:var(--v-ink)}
    .box-h span{font-size:13px; color:var(--v-mute)}
    .bi{display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--v-line)}
    .bi:last-child{border-bottom:0}
    .bi .k{flex:none; min-width:44px; padding:2px 4px; border-radius:4px; text-align:center; font-size:12px; font-weight:700; color:#fff; background:var(--v-cobalt)}
    .bi .k.trip,.bi .k.ev{background:var(--v-ink)}
    .bi .k.iv{background:var(--v-mute)}
    .bi .k.done{background:transparent; color:var(--v-mute); border:1px solid var(--v-line)}
    .bi .wh{flex:1; min-width:0; font-size:14px; color:var(--v-ink)}
    .bi .wh b{font-weight:500}
    .bi .wh span{display:block; font-size:12px; color:var(--v-mute)}
    .bi .r{flex:none; font-size:12px; color:var(--v-mute); text-align:right}
    .bi .r.w{color:var(--v-warn); font-weight:700}
    .empty{margin:0; padding:12px 14px; font-size:14px; color:var(--v-mute)}
    .go{padding:12px 14px; border-top:1px solid var(--v-line)}
    .alert{margin:16px 0 0; padding:12px 14px; border:1px solid var(--v-warn); border-radius:8px; background:var(--v-warn-bg)}
    .alert p{margin:0; font-size:14px; color:var(--v-ink)} .alert p + p{margin-top:4px; font-size:13px; color:var(--v-mute)}
    .alert b{color:var(--v-warn); font-weight:700}
    .day{padding:10px 0; border-top:1px solid var(--v-line)}
    .day:last-child{border-bottom:1px solid var(--v-line)}
    .day.past .dh{color:var(--v-mute)}
    .dh{margin:0 0 2px; font-size:15px; font-weight:700; color:var(--v-ink)}
    .dh small{margin-left:6px; font-size:13px; font-weight:400; color:var(--v-mute)}
    .dh .today{margin-left:6px; font-size:12px; font-weight:500; color:var(--v-cobalt)}
    .sr{display:flex; align-items:center; gap:8px; min-height:36px; padding:0 8px; margin:0 -8px; border-radius:6px}
    .sr .n{flex:1; min-width:0; color:var(--v-ink)}
    .sr .n b{font-weight:500}
    .sr .n span{margin-left:6px; font-size:12px; color:var(--v-mute)}
    .sr.off{background:var(--v-cobalt-bg)}
    .sr.off .st{color:var(--v-cobalt); font-weight:700}
    .st{font-size:13px; font-weight:500; white-space:nowrap; color:var(--v-ink)}
    .st.short,.st.none{color:var(--v-warn); font-weight:700} .st.planned{color:var(--v-mute)}
    .unit{padding:12px 0; border-top:1px solid var(--v-line)}
    .unit:last-child{border-bottom:1px solid var(--v-line)}
    .unit .t{display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; color:var(--v-ink)}
    .unit .t b{font-size:15px; font-weight:500}
    .unit .t span{font-size:13px; color:var(--v-mute)}
    .tag{display:inline-block; padding:0 6px; border-radius:4px; font-size:12px; font-weight:500; line-height:20px; color:var(--v-ink); border:1px solid var(--v-line); background:var(--v-sunken)}
    details.el{margin-top:6px}
    details.el summary{cursor:pointer; font-size:13px; color:var(--v-cobalt); font-weight:500}
    details.el ol{margin:6px 0 0; padding-left:20px; font-size:13px; color:var(--v-ink)}
    details.el li{margin:4px 0}
    details.el ul{margin:2px 0 0; padding-left:16px; color:var(--v-mute)}
    .mo{margin:22px 0 2px; font-size:13px; font-weight:700; color:var(--v-mute)}
    .mo.now{color:var(--v-cobalt)}
    .grp{margin:18px 0 0; font-size:13px; color:var(--v-mute)}
    .steps{display:flex; margin:8px 0 4px}
    .steps div{flex:1; padding:8px 2px 0; border-top:3px solid var(--v-line); font-size:12px; color:var(--v-mute); text-align:center}
    .steps div.d{border-top-color:var(--v-cobalt); color:var(--v-ink)}
    .steps div.n{border-top-color:var(--v-warn); color:var(--v-warn); font-weight:700}
    .tbl{width:100%; border-collapse:collapse; margin-top:8px; font-size:14px; color:var(--v-ink)}
    .tbl th{padding:8px 4px; text-align:left; font-size:12px; font-weight:500; color:var(--v-mute); border-bottom:1px solid var(--v-line)}
    .tbl td{padding:10px 4px; border-bottom:1px solid var(--v-line); vertical-align:middle}
    .tbl .r{text-align:right}
    .tbl .w{color:var(--v-warn); font-weight:700}
    .tbl .mu,.mu{color:var(--v-mute)}
    .tbl small{display:block; font-size:12px; color:var(--v-mute)}
    .fnote{margin:28px 0 0; font-size:12px; line-height:1.6; color:var(--v-mute)}
    .msg{margin:24px 4px; font-size:14px; line-height:1.6; color:var(--v-mute)}
    /* 알리기 시트 */
    .veil{position:fixed; inset:0; z-index:9; background:rgba(18,19,24,.45); display:flex; align-items:flex-end; justify-content:center}
    .veil[hidden]{display:none}
    .sheet{width:100%; max-width:560px; max-height:88vh; overflow:auto; padding:18px 16px calc(20px + env(safe-area-inset-bottom)); background:var(--v-bg); border-radius:14px 14px 0 0}
    .sheet h3{margin:0 0 2px; font-size:18px; color:var(--v-ink)}
    .sheet .q{margin:18px 0 8px; font-size:14px; font-weight:700; color:var(--v-ink)}
    .sheet .q span{font-weight:400; color:var(--v-mute)}
    .chips{display:flex; flex-wrap:wrap; gap:8px}
    .chip2{min-height:40px; padding:0 14px; border:1px solid var(--v-line); border-radius:20px; background:var(--v-paper); color:var(--v-ink); font:inherit; font-size:14px; cursor:pointer}
    .chip2[aria-pressed="true"]{border-color:var(--v-cobalt); background:var(--v-cobalt); color:#fff}
    .seg{display:flex; border:1px solid var(--v-line); border-radius:8px; overflow:hidden}
    .seg button{flex:1; min-height:44px; border:0; background:var(--v-paper); color:var(--v-ink); font:inherit; font-size:15px; cursor:pointer}
    .seg button + button{border-left:1px solid var(--v-line)}
    .seg button[aria-pressed="true"]{background:var(--v-ink); color:var(--v-bg); font-weight:700}
    .sheet input{width:100%; box-sizing:border-box; min-height:44px; padding:0 12px; border:1px solid var(--v-line); border-radius:8px; background:var(--v-paper); color:var(--v-ink); font:inherit}
    .sheet .foot{display:flex; gap:8px; margin-top:20px}
    .sheet .foot .btn{flex:1}
    .sheet .sm{margin:12px 0 0; font-size:13px; color:var(--v-mute)}
  </style>
</head>
<body>
  <header class="fh"><div class="in" id="head"><p class="co">일학습병행 공동훈련센터</p><h1>불러오는 중…</h1></div></header>
  <nav class="ftabs" role="tablist" aria-label="화면"><div class="ft-in" id="tabs"></div></nav>
  <main class="fw" id="main">
    <!-- 이번 달(현장교사) / 휴가·출장(HRD) -->
    <section id="t-month" hidden>
      <div id="m-sum"></div>
      <div class="box" id="m-abs"></div>
      <div id="m-alert"></div>
      <div class="mnav"><button type="button" id="m-prev" aria-label="이전 달">‹</button><b id="m-title"></b><button type="button" id="m-next" aria-label="다음 달">›</button></div>
      <p class="lede">인정 시간은 센터가 매일 아침 행정지원시스템에서 조회한 값이에요(어제까지).</p>
      <div id="m-days"></div>
    </section>
    <section id="t-units" hidden><h2>OJT 능력단위</h2><p class="lede">실시신고 시간표의 달별 배정이에요. 단위를 누르면 학습안내서의 능력단위요소·수행과업이 나와요.</p><div id="u-list"></div></section>
    <section id="t-tasks" hidden><h2>월말 할 일</h2><p class="lede">내부평가·면담일지처럼 달마다 센터로 보내 주셔야 하는 것이에요.</p><div id="k-list"></div></section>
    <section id="t-attn" hidden><div id="a-view"></div></section>
    <section id="t-allow" hidden><div id="w-view"></div></section>
    <p class="msg" id="msg" hidden></p>
    <p class="fnote" id="foot"></p>
  </main>

  <div class="veil" id="veil" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t">
      <h3 id="sh-t">휴가·출장 알리기</h3>
      <p class="lede">알려 주시면 센터가 그 날 훈련을 다른 날로 옮겨요.</p>
      <p class="q">누가 <span>(여러 명 가능)</span></p><div class="chips" id="sh-who"></div>
      <p class="q">언제 <span>(훈련일만, 여러 날 가능)</span></p><div class="chips" id="sh-day"></div>
      <p class="q">무엇</p><div class="seg" id="sh-kind"><button type="button" aria-pressed="true" data-k="leave">휴가</button><button type="button" aria-pressed="false" data-k="trip">출장</button></div>
      <p class="q">메모 <span>(선택)</span></p><input id="sh-note" maxlength="300" placeholder="예: 고객사 현장 지원" />
      <p class="q">알리는 분</p><input id="sh-by" maxlength="40" placeholder="이름 (예: 홍길동 과장)" autocomplete="name" />
      <p class="sm" id="sh-msg"></p>
      <div class="foot"><button type="button" class="btn" id="sh-close">닫기</button><button type="button" class="btn solid" id="sh-ok" disabled>알리기</button></div>
    </div>
  </div>

  <script type="module">
    // [sql/70] 우리 학생 OJT — 기업 담당자(앱에 기업 초대코드로 가입한 기기)용. 본인 확인 = 프로필 code(학생과 같은 방식, 사용자 10/22).
    //   현장교사·HRD담당자로 나누지 않고 회사 하나: 이번 달(휴가·출장) · 월별 출결 · 전담인력수당 · 능력단위 · 월말 할 일.
    //   첫 화면 위에 '이번 달 예정 시수·능력단위·월말 할 일' 요약(사용자 10/22). 비콘은 인정 시간·상태만(입실·퇴실 시각은 서버도 안 줌).
    import { supabase, configReady, friendlyError, esc, getProfile } from './app.js';

    const $ = id => document.getElementById(id);
    const prof = getProfile();
    const CODE = prof.target_type === 'company' ? (prof.code || '') : '';
    const AK = { leave: '휴가', trip: '출장' }, AKRO = { leave: '휴가로', trip: '출장으로' };
    const ST = { ok: '인정', short: '모자람', none: '기록 없음', planned: '예정' };
    const BY_KEY = 'ilhak_company_by';
    const pad = n => String(n).padStart(2, '0');
    const ymAdd = (ym, n) => { const d = new Date(Number(ym.slice(0, 4)), Number(ym.slice(5)) - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
    const W = '일월화수목금토';
    const md = d => `${Number(d.slice(5, 7))}/${Number(d.slice(8, 10))}(${W[new Date(d.slice(0, 10) + 'T00:00:00').getDay()]})`;
    const moName = ym => `${Number(ym.slice(5))}월`;
    const errText = e => /too_many_attempts/.test((e && e.message) || '') ? '잠시 후 다시 시도해 주세요.' : friendlyError(e);
    const unitsOf = s => [...new Set(String(s || '').split('·').map(x => x.trim()).filter(Boolean))];

    let D = null, ym = null, thisYm = null, tab = null, today = null;

    function fail(msg) {
      $('head').innerHTML = `<a class="back" href="./index.html">‹ 홈</a><h1>우리 학생 OJT</h1>`;
      $('tabs').innerHTML = ''; document.querySelectorAll('.fw section').forEach(s => { s.hidden = true; });
      $('msg').hidden = false; $('msg').textContent = msg;
    }

    async function load(month) {
      if (!configReady()) { fail('연결 설정이 필요합니다.'); return; }
      if (!CODE) { fail('기업 담당자로 가입한 기기에서 열 수 있어요. 홈에서 기업 초대코드로 가입해 주세요.'); return; }
      const { data, error } = await supabase.rpc('company_home', { p_code: CODE, p_month: month || null });
      if (error) { fail(errText(error)); return; }
      if (!data || !data.ok) { fail('기업 코드를 확인하지 못했어요. 센터 담당 선생님께 문의해 주세요.'); return; }
      D = data; ym = data.month; today = data.today; thisYm = thisYm || today.slice(0, 7);
      $('msg').hidden = true;
      draw();
    }

    // ---------- 공통 계산 ----------
    const studs = () => D.students || [];
    const courseOf = s => ((s.days || []).find(d => d.course) || {}).course || '';
    const multiCourse = () => new Set(studs().map(courseOf).filter(Boolean)).size > 1;
    const monthRow = (s, m) => (s.months || []).find(x => x.month === m) || null;
    const liveAbs = s => (s.absences || []).filter(a => a.state === 'open' || a.state === 'applied');
    const absOn = (s, day) => { const xs = (s.absences || []).filter(a => a.day === day); return xs.find(a => a.state !== 'rejected') || null; };
    // 인정이 정규시간보다 적은 지난 날(휴가·출장 체크가 없는 것만)
    const shorts = () => studs().flatMap(s => (s.days || []).filter(d => (d.status === 'short' || d.status === 'none') && !absOn(s, d.day))
      .map(d => ({ s, d })));
    const openTasks = () => (D.tasks || []).filter(t => !t.done_on);

    function draw() {
      const sh = ym === thisYm ? shorts() : [];
      const fut = studs().flatMap(s => (s.days || []).map(d => d.day)).filter(d => d >= today);
      const leftDays = new Set(fut).size;
      const unpaid = (D.allowance || []).filter(a => a.state === '미신청');
      const lastSt = latestStatusMonth();
      const lastOpen = lastSt ? statusRows(lastSt).filter(x => !x.st || !x.st.center_confirmed_on).length : 0;
      // 머리 — 결론 한 줄(수당 미신청이 가장 급함 → 확인 필요한 날 → 남은 훈련일)
      const title = unpaid.length ? `${moName(unpaid[0].period)}분 전담인력수당을 아직 신청하지 않았어요`
        : sh.length ? `확인이 필요한 날이 ${sh.length}건 있어요` : `${moName(thisYm)} OJT, 남은 훈련일 ${leftDays}일이에요`;
      const sum = [[studs().length + '명', '학생'], [shorts().length + '건', '확인 필요', shorts().length ? 'w' : ''], [openTasks().length + '건', '월말 할 일']];
      if (unpaid.length) sum.push(['미신청 ' + unpaid.length, '전담인력수당', 'w']);
      $('head').innerHTML = `<a class="back" href="./index.html">‹ 홈</a><p class="co">${esc(D.company)} · 기업 담당자</p><h1>${esc(title)}</h1><div class="sum">` +
        sum.map(([v, l, c]) => `<div><b class="${c || ''}">${esc(v)}</b>${esc(l)}</div>`).join('') + `</div>`;
      const TABS = [['month', '이번 달', shorts().length], ['attn', '월별 출결', lastOpen], ['allow', '전담인력수당', unpaid.length], ['units', '능력단위', 0], ['tasks', '월말 할 일', openTasks().length]];
      if (!TABS.some(t => t[0] === tab)) tab = TABS[0][0];
      $('tabs').innerHTML = TABS.map(([k, l, n]) => `<button type="button" role="tab" aria-selected="${k === tab}" data-t="${k}">${l}${n ? `<span class="dot">${n}</span>` : ''}</button>`).join('');
      $('tabs').querySelectorAll('button').forEach(b => b.addEventListener('click', () => { tab = b.dataset.t; draw(); }));
      document.querySelectorAll('.fw section').forEach(s => { s.hidden = s.id !== 't-' + tab; });
      $('foot').textContent = `${D.company} 학습근로자의 OJT 출결·일정이에요. 문의는 센터 담당 선생님께.`;
      drawMonth(sh); drawUnits(); drawTasks(); drawAttn(); drawAllow();
    }

    // 이번 달 요약 — 예정 시수·능력단위·월말 할 일(두 역할 공통, 사용자 10/22)
    function summaryHtml() {
      const m = thisYm, groups = new Map();
      studs().forEach(s => {
        const r = monthRow(s, m); if (!r) return;
        const k = `${Number(r.planned) || 0}|${r.units || ''}`;
        if (!groups.has(k)) groups.set(k, { r, names: [] });
        groups.get(k).names.push(s.name);
      });
      const tasks = (D.tasks || []).filter(t => t.month === m || !t.done_on);
      let h = `<div class="box"><div class="box-h"><b>${moName(m)} OJT</b><span>실시신고 시간표 기준</span></div>`;
      h += groups.size ? [...groups.values()].map(g =>
        `<div class="bi"><span class="k">${Number(g.r.planned) || 0}h</span><span class="wh"><b>${esc(unitsOf(g.r.units).join(', ') || '능력단위 없음')}</b>` +
        `<span>${esc(g.names.join(', '))}</span></span></div>`).join('') : `<p class="empty">이 달 OJT 배정이 없어요.</p>`;
      if (tasks.length) h += tasks.map(taskRow).join('');
      return h + `</div>`;
    }
    function taskRow(t) {
      const cls = t.done_on ? 'done' : t.kind === '내부평가' ? 'ev' : 'iv';
      const due = t.done_on ? `받음 ${md(t.done_on)}` : t.due_on ? `${md(t.due_on)}까지` : moName(t.month);
      const late = !t.done_on && t.due_on && t.due_on < today;
      return `<div class="bi"><span class="k ${cls}">${esc(t.kind)}</span><span class="wh"><b>${esc(t.title)}</b>` +
        `<span>${t.course ? esc(t.course) + ' · ' : ''}${t.note ? esc(t.note) : moName(t.month) + '분'}</span></span>` +
        `<span class="r${late ? ' w' : ''}">${late ? '지남 · ' : ''}${esc(due)}</span></div>`;
    }

    // ---------- 이번 달 · 휴가·출장 ----------
    function drawMonth(sh) {
      $('m-sum').innerHTML = summaryHtml();
      const list = studs().flatMap(s => liveAbs(s).map(a => ({ s, a }))).sort((x, y) => (x.a.day < y.a.day ? -1 : 1));
      $('m-abs').innerHTML = `<div class="box-h"><b>휴가·출장</b><span>${list.length ? list.length + '건 · ' : ''}센터가 다른 날로 옮겨요</span></div>` +
        (list.length ? list.map(({ s, a }) => {
          const who = a.by_role === 'company' || a.by_role === 'teacher' ? (a.by_name || '기업 담당자') : a.by_role === 'admin' ? '센터' : '학생 본인';
          return `<div class="bi"><span class="k${a.kind === 'trip' ? ' trip' : ''}">${AK[a.kind]}</span><span class="wh"><b>${md(a.day)} ${esc(s.name)}</b>` +
            `<span>${esc(who)}${a.note ? ' · ' + esc(a.note) : ''}</span></span>` +
            (a.state === 'applied' ? `<span class="r">다른 날로 옮김</span>` : `<button type="button" class="lnk" data-cancel="${esc(a.id)}">취소</button>`) + `</div>`;
        }).join('') : `<p class="empty">알린 휴가·출장이 없어요.</p>`) +
        `<div class="go"><button type="button" class="btn solid wide" id="open-sheet">휴가·출장 알리기</button></div>`;
      $('m-alert').innerHTML = sh.length
        ? `<div class="alert"><p><b>확인이 필요한 날 ${sh.length}건</b> — 인정 시간이 정규시간보다 적어요.</p>` +
          `<p>${sh.slice(0, 6).map(({ s, d }) => `${md(d.day)} ${esc(s.name)} ${d.status === 'none' ? '기록 없음' : (Number(d.recognized) || 0) + 'h / ' + Number(d.hours) + 'h'}`).join(' · ')}${sh.length > 6 ? ` 외 ${sh.length - 6}건` : ''}. 휴가·출장이었다면 위에서 알려 주세요.</p></div>` : '';
      $('m-title').textContent = `${ym.slice(0, 4)}년 ${Number(ym.slice(5))}월`;
      $('m-prev').disabled = ym <= ymAdd(thisYm, -2); $('m-next').disabled = ym >= ymAdd(thisYm, 2);
      // 날짜별 — 상태만, 휴가·출장 줄은 띠. 오늘·앞으로 먼저, 지난 날은 아래
      const byDay = {};
      studs().forEach(s => (s.days || []).forEach(d => { (byDay[d.day] = byDay[d.day] || []).push({ s, d }); }));
      const days = Object.keys(byDay).sort(), mc = multiCourse();
      const row = ds => {
        const it = byDay[ds].sort((a, b) => a.s.name.localeCompare(b.s.name, 'ko')), t = it[0].d;
        return `<div class="day${ds < today ? ' past' : ''}"><p class="dh">${md(ds)}<small>${t.start && t.end ? `${esc(t.start)}–${esc(t.end)} · ` : ''}${Number(t.hours) || 0}시간</small>${ds === today ? '<span class="today">오늘</span>' : ''}</p>` +
          it.map(({ s, d }) => {
            const a = absOn(s, ds);
            const st = a ? `<span class="st">${AK[a.kind]}</span>`
              : `<span class="st ${d.status}">${d.status === 'ok' || d.status === 'short' ? (Number(d.recognized) || 0) + 'h ' : ''}${ST[d.status] || ''}</span>`;
            return `<div class="sr${a ? ' off' : ''}"><span class="n"><b>${esc(s.name)}</b>${mc && d.course ? `<span>${esc(d.course)}</span>` : ''}</span>${st}</div>`;
          }).join('') + `</div>`;
      };
      const fut = days.filter(d => d >= today), past = days.filter(d => d < today).reverse();
      $('m-days').innerHTML = days.length
        ? fut.map(row).join('') + (past.length ? `<h2 style="margin-top:28px">지난 훈련일</h2>` + past.map(row).join('') : '')
        : `<p class="msg" style="margin:12px 0">이 달에는 등록된 OJT 훈련일이 없어요.</p>`;
      $('open-sheet').addEventListener('click', openSheet);
      $('m-abs').querySelectorAll('[data-cancel]').forEach(b => b.addEventListener('click', () => cancel(b)));
      $('m-prev').onclick = () => load(ymAdd(ym, -1));
      $('m-next').onclick = () => load(ymAdd(ym, 1));
    }

    // ---------- 알리기 시트 — 학생(여러 명) × 앞으로의 훈련일(여러 날) × 휴가/출장 ----------
    const pick = { who: new Set(), day: new Set(), kind: 'leave' };
    function openSheet() {
      pick.who.clear(); pick.day.clear(); pick.kind = 'leave';
      const days = [...new Set(studs().flatMap(s => (s.days || []).filter(d => d.day >= today).map(d => d.day)))].sort();
      $('sh-who').innerHTML = studs().map(s => `<button type="button" class="chip2" aria-pressed="false" data-v="${esc(s.id)}">${esc(s.name)}</button>`).join('');
      $('sh-day').innerHTML = days.length ? days.map(d => `<button type="button" class="chip2" aria-pressed="false" data-v="${d}">${md(d)}</button>`).join('')
        : `<p class="lede" style="margin:0">${moName(ym)}에 앞으로 남은 훈련일이 없어요. 위에서 다음 달로 넘긴 뒤 알려 주세요.</p>`;
      const bind = (id, set) => $(id).querySelectorAll('.chip2').forEach(b => b.addEventListener('click', () => {
        const on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', on);
        on ? set.add(b.dataset.v) : set.delete(b.dataset.v); sheetMsg();
      }));
      bind('sh-who', pick.who); bind('sh-day', pick.day);
      $('sh-kind').querySelectorAll('button').forEach(b => {
        b.setAttribute('aria-pressed', b.dataset.k === 'leave');
        b.onclick = () => { pick.kind = b.dataset.k; $('sh-kind').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); sheetMsg(); };
      });
      $('sh-note').value = '';
      try { $('sh-by').value = localStorage.getItem(BY_KEY) || prof.name || ''; } catch (_) { $('sh-by').value = prof.name || ''; }
      sheetMsg(); $('veil').hidden = false;
    }
    // 고른 학생 × 날짜 중 그 학생에게 실제 훈련일인 것만
    const pairs = () => studs().filter(s => pick.who.has(s.id)).flatMap(s => [...pick.day].filter(d => (s.days || []).some(x => x.day === d) && !absOn(s, d)).map(d => ({ s, d })));
    function sheetMsg() {
      const n = pairs().length;
      $('sh-msg').textContent = !pick.who.size || !pick.day.size ? '학생과 날짜를 골라 주세요.'
        : n ? `${n}건을 ${AKRO[pick.kind]} 알려요. 같은 과정 학생이 함께 훈련하는 날은 과정 전체가 옮겨질 수 있어요.`
        : '고른 날짜에 그 학생의 훈련이 없거나 이미 알린 날이에요.';
      $('sh-ok').disabled = !n;
    }
    $('sh-close').addEventListener('click', () => { $('veil').hidden = true; });
    $('veil').addEventListener('click', e => { if (e.target === $('veil')) $('veil').hidden = true; });
    $('sh-ok').addEventListener('click', async () => {
      const by = $('sh-by').value.trim();
      if (!by) { $('sh-msg').textContent = '알리는 분 이름을 적어 주세요.'; $('sh-by').focus(); return; }
      try { localStorage.setItem(BY_KEY, by); } catch (_) {}
      $('sh-ok').disabled = true;
      const note = $('sh-note').value.trim(); let okN = 0, bad = [];
      for (const { s, d } of pairs()) {
        try {
          const { data, error } = await supabase.rpc('company_absence', { p_code: CODE, p_student: s.id, p_day: d, p_kind: pick.kind, p_note: note, p_by_name: by });
          if (error || !data || !data.ok) bad.push(`${md(d)} ${s.name}`); else okN++;
        } catch (_) { bad.push(`${md(d)} ${s.name}`); }
      }
      $('veil').hidden = true;
      if (bad.length) alert(`${okN}건은 알렸어요. 다음은 처리하지 못했어요: ${bad.join(', ')}`);
      load(ym);
    });
    async function cancel(b) {
      if (!confirm('이 휴가·출장을 취소할까요?')) return;
      b.disabled = true;
      try {
        const { data, error } = await supabase.rpc('company_absence_cancel', { p_code: CODE, p_id: b.dataset.cancel });
        if (error) alert(errText(error));
        else if (!data || !data.ok) alert(data && data.reason === 'applied' ? '이미 다른 날로 옮긴 날이라 취소할 수 없어요. 센터에 문의해 주세요.' : '처리하지 못했어요.');
      } catch (_) { alert('연결이 불안정해요. 잠시 후 다시 시도해 주세요.'); }
      load(ym);
    }

    // ---------- 능력단위 ----------
    function drawUnits() {
      // 같은 배정을 받는 학생끼리 묶음(과정이 다르면 따로)
      const groups = new Map();
      studs().forEach(s => {
        const k = JSON.stringify((s.months || []).map(m => [m.month, m.planned, m.units]));
        if (!groups.has(k)) groups.set(k, { s, names: [] });
        groups.get(k).names.push(s.name);
      });
      const evMonths = new Map();   // 능력단위 → 내부평가 달(월말 할 일의 제목에 단위 이름이 있으면)
      (D.tasks || []).filter(t => t.kind === '내부평가').forEach(t => evMonths.set(t.title, t.month));
      let h = '';
      groups.forEach(g => {
        if (groups.size > 1) h += `<p class="grp">${esc(g.names.join(', '))}${courseOf(g.s) ? ' · ' + esc(courseOf(g.s)) : ''}</p>`;
        const info = u => (g.s.units || []).find(x => x.unit === u) || null;
        const months = (g.s.months || []).filter(m => Number(m.planned) > 0 || m.units);
        if (!months.length) { h += `<p class="msg" style="margin:8px 0">OJT 배정이 아직 없어요.</p>`; return; }
        months.forEach(m => {
          const now = m.month === thisYm;
          h += `<p class="mo${now ? ' now' : ''}">${moName(m.month)}${m.month.slice(0, 4) !== thisYm.slice(0, 4) ? ` (${m.month.slice(0, 4)})` : ''} · ${Number(m.planned) || 0}시간${now ? ' · 이번 달' : ''}</p>`;
          const us = unitsOf(m.units);
          h += us.length ? us.map(u => {
            const i = info(u), els = (i && i.elements) || [];
            const ev = [...evMonths.entries()].find(([t]) => t.includes(u));
            return `<div class="unit"><div class="t"><b>${esc(u)}</b>${i && i.hours != null ? `<span>학습안내서 ${Number(i.hours)}시간</span>` : ''}${ev ? `<span class="tag">내부평가 ${moName(ev[1])}</span>` : ''}</div>` +
              (els.length ? `<details class="el"${now ? ' open' : ''}><summary>능력단위요소 ${els.length}개</summary><ol>` +
                els.map(e => `<li>${esc(e.name)}${(e.tasks || []).length ? `<ul>${e.tasks.map(t => `<li>${esc(t)}</li>`).join('')}</ul>` : ''}</li>`).join('') + `</ol></details>` : '') + `</div>`;
          }).join('') : `<div class="unit"><span class="mu">능력단위 없음</span></div>`;
        });
      });
      $('u-list').innerHTML = h || `<p class="msg">학생이 없어요.</p>`;
    }

    // ---------- 월말 할 일 ----------
    function drawTasks() {
      const ts = (D.tasks || []).slice().sort((a, b) => (a.month + (a.due_on || '') < b.month + (b.due_on || '') ? -1 : 1));
      $('k-list').innerHTML = ts.length ? `<div class="box" style="margin-top:6px">${ts.map(taskRow).join('')}</div>`
        : `<p class="msg" style="margin:8px 0">센터가 아직 올린 할 일이 없어요.</p>`;
    }

    // ---------- HRD: 월별 출결 ----------
    function latestStatusMonth() {
      const ms = [...new Set(studs().flatMap(s => (s.status || []).map(x => x.month)))].sort();
      return ms.length ? ms[ms.length - 1] : null;
    }
    const statusRows = m => studs().map(s => ({ s, st: (s.status || []).find(x => x.month === m) || null, mr: monthRow(s, m) }));
    let attnYm = null;
    function drawAttn() {
      const ms = [...new Set(studs().flatMap(s => (s.status || []).map(x => x.month)))].sort();
      if (!ms.length) { $('a-view').innerHTML = `<h2>월별 출결</h2><p class="msg" style="margin:8px 0">센터가 아직 월 마감 자료를 올리지 않았어요. 올라오면 달마다 학습활동서·출석확인 진행을 여기서 볼 수 있어요.</p>`; return; }
      if (!attnYm || !ms.includes(attnYm)) attnYm = ms[ms.length - 1];
      const rows = statusRows(attnYm), i = ms.indexOf(attnYm);
      const all = f => rows.every(f), any = f => rows.some(f);
      const diaryOk = r => r.st && r.st.train_days != null && r.st.diary_days >= r.st.train_days;
      const steps = [['정규시간 등록', true], ['출결', true], ['학습활동서', all(diaryOk)], ['학생 출석확인', all(r => r.st && r.st.student_confirmed_on)], ['센터 확인', all(r => r.st && r.st.center_confirmed_on)]];
      const firstNo = steps.findIndex(x => !x[1]);
      const lack = rows.filter(r => !diaryOk(r)), unconf = rows.filter(r => diaryOk(r) && !(r.st && r.st.student_confirmed_on));
      let h = `<div class="mnav"><button type="button" id="a-prev" aria-label="이전 달"${i <= 0 ? ' disabled' : ''}>‹</button><b>${attnYm.slice(0, 4)}년 ${moName(attnYm)}분</b><button type="button" id="a-next" aria-label="다음 달"${i >= ms.length - 1 ? ' disabled' : ''}>›</button></div>` +
        `<p class="lede">한 달 출결은 아래 순서로 마감돼요. 센터 확인까지 끝나야 그 달 훈련이 인정돼요.</p>` +
        `<div class="steps">${steps.map(([l, d], k) => `<div class="${d ? 'd' : k === firstNo ? 'n' : ''}">${l}</div>`).join('')}</div>`;
      if (lack.length) h += `<div class="alert"><p><b>${esc(lack.map(r => r.s.name).join(', '))} 학생의 학습활동서가 비어 있어요.</b></p><p>학생이 다 쓰고 출석확인을 눌러야 센터가 확인할 수 있어요. 학생에게 한 번 알려 주세요.</p></div>`;
      else if (unconf.length) h += `<div class="alert"><p><b>${esc(unconf.map(r => r.s.name).join(', '))} 학생이 아직 출석확인을 누르지 않았어요.</b></p><p>고용24 학습근로자 화면에서 출석확인을 누르도록 알려 주세요.</p></div>`;
      h += `<table class="tbl"><thead><tr><th>학생</th><th class="r">인정 / 계획</th><th class="r">학습활동서</th><th class="r">출석확인</th></tr></thead><tbody>` +
        rows.map(({ s, st, mr }) => `<tr><td>${esc(s.name)}${(st && st.course) ? `<small>${esc(st.course)}</small>` : ''}</td>` +
          `<td class="r">${mr ? `${mr.actual != null ? Number(mr.actual) : '—'} / ${Number(mr.planned) || 0}h` : '—'}</td>` +
          `<td class="r${st && !diaryOk({ st }) ? ' w' : ''}">${st && st.train_days != null ? `${st.diary_days || 0} / ${st.train_days}일` : '—'}</td>` +
          `<td class="r${st && st.student_confirmed_on ? '' : ' mu'}">${st && st.student_confirmed_on ? md(st.student_confirmed_on) : '전'}</td></tr>`).join('') + `</tbody></table>` +
        (any(r => r.st && r.st.center_confirmed_on) ? `<p class="lede" style="margin-top:10px">센터 확인: ${rows.filter(r => r.st && r.st.center_confirmed_on).map(r => `${esc(r.s.name)} ${md(r.st.center_confirmed_on)}`).join(' · ')}</p>` : '');
      $('a-view').innerHTML = h;
      $('a-prev')?.addEventListener('click', () => { attnYm = ms[i - 1]; drawAttn(); });
      $('a-next')?.addEventListener('click', () => { attnYm = ms[i + 1]; drawAttn(); });
    }

    // ---------- HRD: 전담인력수당 ----------
    function drawAllow() {
      const al = D.allowance || [], un = al.filter(a => a.state === '미신청');
      const checked = al.reduce((m, a) => (a.checked_at && a.checked_at > m ? a.checked_at : m), '');
      let h = `<h2>전담인력활동수당</h2><p class="lede">OJT 출결이 있는 달마다 신청할 수 있어요. 상태는 센터가 행정지원시스템에서 확인한 값이에요${checked ? `(${md(checked)} 확인)` : ''}.</p>`;
      if (un.length) h += `<div class="alert" style="margin-top:6px"><p><b>${un.map(a => moName(a.period) + '분').join(', ')} 아직 신청 안 됨</b></p><p>그 달 OJT 출결이 있어 신청 대상이에요. 신청 방법은 센터 담당 선생님께 문의해 주세요.</p></div>`;
      h += al.length ? `<table class="tbl"><thead><tr><th>기간</th><th>상태</th><th class="r">신청일</th></tr></thead><tbody>` +
          al.map(a => `<tr><td>${a.period.slice(0, 4) !== thisYm.slice(0, 4) ? a.period.slice(0, 4) + '년 ' : ''}${moName(a.period)}분</td><td class="${a.state === '미신청' ? 'w' : ''}">${esc(a.state)}</td><td class="r${a.applied_on ? '' : ' mu'}">${a.applied_on ? md(a.applied_on) : '—'}</td></tr>`).join('') +
          `</tbody></table><p class="lede" style="margin-top:10px">상태 순서: 신청 → 승인 → 확정 → 지급완료</p>`
        : `<p class="msg" style="margin:8px 0">센터가 아직 확인한 신청 내역이 없어요.</p>`;
      $('w-view').innerHTML = h;
    }

    load();
  </script>
</body>
</html>
