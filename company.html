<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>우리 학생 OJT · 일학습병행 앱</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#121318" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./student.css" /><!-- 학생 화면 디자인(관리자와 같은 계열) — 토큰 --v-* -->
  <script src="./config.js"></script>
  <style>
    /* 기업 담당자 페이지(docs/FIELD.md 시안 v2) — 먹색 머리 + 코발트 하나 + 모자람·미신청만 warn, 1px 선 */
    body{background:var(--v-bg)}
    .fh{background:var(--v-head); color:#fff; padding:20px 16px 18px}
    .fh .in,.fw{max-width:560px; margin:0 auto}
    .fh .co{margin:0; font-size:13px; color:var(--v-mute-on-ink)}
    .fh .back{display:inline-block; margin:0 0 8px; padding:4px 0; font-size:13px; color:var(--v-mute-on-ink); text-decoration:none}
    .fh h1{margin:4px 0 0; font-size:22px; font-weight:700; line-height:1.35; color:#fff}
    .fw{padding:0 16px 96px}
    .fw section[hidden]{display:none}
    .fw h2{margin:24px 0 4px; font-size:16px; font-weight:700; color:var(--v-ink)}
    .lede{margin:0 0 10px; font-size:13px; line-height:1.5; color:var(--v-mute)}
    .mnav{display:flex; align-items:center; justify-content:space-between; margin:20px 0 6px}
    .mnav b{font-size:16px; color:var(--v-ink)}
    .mnav button{min-width:44px; min-height:40px; border:1px solid var(--v-line); border-radius:6px; background:var(--v-paper); color:var(--v-ink); font-size:16px; cursor:pointer}
    .mnav button:disabled{opacity:.4; cursor:default}
    .btn{min-height:44px; padding:0 16px; border:1px solid var(--v-cobalt); border-radius:8px; background:var(--v-paper); color:var(--v-cobalt); font:inherit; font-size:15px; font-weight:500; cursor:pointer}
    .btn.solid{background:var(--v-cobalt); color:#fff}
    .btn.wide{width:100%}
    .btn:disabled{opacity:.5; cursor:default}
    .lnk{flex:none; min-height:36px; padding:0 10px; border:0; background:none; color:var(--v-cobalt); font:inherit; font-size:13px; font-weight:500; cursor:pointer}
    .box{margin:16px 0 0; border:1px solid var(--v-line); border-radius:10px; background:var(--v-paper)}
    .box-h{display:flex; align-items:baseline; justify-content:space-between; gap:8px; padding:12px 14px; border-bottom:1px solid var(--v-line)}
    .box-h b{font-size:15px; color:var(--v-ink)}
    .box-h span{font-size:13px; color:var(--v-mute)}
    .bi{display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--v-line)}
    .bi:last-child{border-bottom:0}
    .bi .k{flex:none; min-width:44px; padding:2px 4px; border-radius:4px; text-align:center; font-size:12px; font-weight:700; color:#fff; background:var(--v-cobalt)}
    .bi .k.trip,.bi .k.ev{background:var(--v-ink)}
    .bi .k.iv{background:var(--v-mute)}
    .bi .k.done{background:transparent; color:var(--v-mute); border:1px solid var(--v-line)}
    .bi .wh{flex:1; min-width:0; font-size:14px; color:var(--v-ink)}
    .bi .wh b{font-weight:500}
    .bi .wh span{display:block; font-size:12px; color:var(--v-mute)}
    .bi .r{flex:none; font-size:12px; color:var(--v-mute); text-align:right}
    .bi .r.w{color:var(--v-warn); font-weight:700}
    .empty{margin:0; padding:12px 14px; font-size:14px; color:var(--v-mute)}
    .go{padding:12px 14px; border-top:1px solid var(--v-line)}
    .alert{margin:16px 0 0; padding:12px 14px; border:1px solid var(--v-warn); border-radius:8px; background:var(--v-warn-bg)}
    .alert p{margin:0; font-size:14px; color:var(--v-ink)} .alert p + p{margin-top:4px; font-size:13px; color:var(--v-mute)}
    .alert b{color:var(--v-warn); font-weight:700}
    .day{padding:10px 0; border-top:1px solid var(--v-line)}
    .day:last-child{border-bottom:1px solid var(--v-line)}
    .day.past .dh{color:var(--v-mute)}
    .dh{margin:0 0 2px; font-size:15px; font-weight:700; color:var(--v-ink)}
    .dh small{margin-left:6px; font-size:13px; font-weight:400; color:var(--v-mute)}
    .dh .today{margin-left:6px; font-size:12px; font-weight:500; color:var(--v-cobalt)}
    .sr{display:flex; align-items:center; gap:8px; min-height:36px; padding:0 8px; margin:0 -8px; border-radius:6px}
    .sr .n{flex:1; min-width:0; color:var(--v-ink)}
    .sr .n b{font-weight:500}
    .sr .n span{margin-left:6px; font-size:12px; color:var(--v-mute)}
    .sr .n small.u{display:block; margin:1px 0 4px; font-size:12px; line-height:1.4; color:var(--v-cobalt)}
    .sr.off{background:var(--v-cobalt-bg)}
    .sr.off .st{color:var(--v-cobalt); font-weight:700}
    .sr.tk{background:var(--v-sunken)} .sr.tk .n b{font-size:13px} .sr.tk .st{font-size:12px; color:var(--v-ink)}
    .sr.tk.done{opacity:.6}
    .st{font-size:13px; font-weight:500; white-space:nowrap; color:var(--v-ink)}
    .st.short,.st.none{color:var(--v-warn); font-weight:700} .st.planned{color:var(--v-mute)}
    .unit{padding:12px 0; border-top:1px solid var(--v-line)}
    .unit:last-child{border-bottom:1px solid var(--v-line)}
    .unit .t{display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; color:var(--v-ink)}
    .unit .t b{font-size:15px; font-weight:500}
    .unit .t span{font-size:13px; color:var(--v-mute)}
    .tag{display:inline-block; padding:0 6px; border-radius:4px; font-size:12px; font-weight:500; line-height:20px; color:var(--v-ink); border:1px solid var(--v-line); background:var(--v-sunken)}
    details.el{margin-top:6px}
    details.el summary{cursor:pointer; font-size:13px; color:var(--v-cobalt); font-weight:500}
    details.el ol{margin:6px 0 0; padding-left:20px; font-size:13px; color:var(--v-ink)}
    details.el li{margin:4px 0}
    details.el ul{margin:2px 0 0; padding-left:16px; color:var(--v-mute)}
    .mo{margin:22px 0 2px; font-size:13px; font-weight:700; color:var(--v-mute)}
    .mo.now{color:var(--v-cobalt)}
    .grp{margin:18px 0 0; font-size:13px; color:var(--v-mute)}
    .steps{display:flex; margin:8px 0 4px}
    .steps div{flex:1; padding:8px 2px 0; border-top:3px solid var(--v-line); font-size:12px; color:var(--v-mute); text-align:center}
    .steps div.d{border-top-color:var(--v-cobalt); color:var(--v-ink)}
    .steps div.n{border-top-color:var(--v-warn); color:var(--v-warn); font-weight:700}
    .tbl{width:100%; border-collapse:collapse; margin-top:8px; font-size:14px; color:var(--v-ink)}
    .tbl th{padding:8px 4px; text-align:left; font-size:12px; font-weight:500; color:var(--v-mute); border-bottom:1px solid var(--v-line)}
    .tbl td{padding:10px 4px; border-bottom:1px solid var(--v-line); vertical-align:middle}
    .tbl .r{text-align:right}
    .tbl .w{color:var(--v-warn); font-weight:700}
    .tbl .mu,.mu{color:var(--v-mute)}
    .tbl small{display:block; font-size:12px; color:var(--v-mute)}
    /* 달력 — 칸마다 글자 표시(점 대신, 사용자 10/22) */
    .cal{display:grid; grid-template-columns:repeat(7, minmax(0, 1fr)); gap:2px; margin-top:4px}
    .cal .wd{padding:4px 0; text-align:center; font-size:12px; color:var(--v-mute)}
    .cal .wd.sun{color:var(--v-warn)}
    .cal button{display:flex; flex-direction:column; align-items:stretch; gap:2px; min-height:64px; padding:4px 2px; border:1px solid transparent; border-radius:6px; background:none; font:inherit; text-align:center; cursor:pointer; color:var(--v-ink)}
    .cal button.blank{visibility:hidden}
    .cal button .dn{font-size:13px; line-height:16px}
    .cal button.sun .dn{color:var(--v-warn)}
    .cal button.past .dn{color:var(--v-mute)}
    .cal button.today .dn{font-weight:700; color:var(--v-cobalt)}
    .cal button[aria-pressed="true"]{border-color:var(--v-cobalt); background:var(--v-cobalt-bg)}
    .cal .lb{display:block; overflow:hidden; white-space:nowrap; border-radius:3px; font-size:11px; font-weight:500; line-height:16px}
    .lb.tr{background:var(--v-cobalt-bg); color:var(--v-cobalt)}
    .lb.off{background:var(--v-sunken); color:var(--v-ink); border:1px solid var(--v-line)}
    .lb.chk{background:var(--v-warn-bg); color:var(--v-warn)}
    .lb.ev{background:var(--v-ink); color:var(--v-bg)}
    .lb.iv{background:var(--v-mute); color:var(--v-bg)}
    .lb.done{background:none; color:var(--v-mute); text-decoration:line-through}
    .lb.ex{background:var(--v-sunken); color:var(--v-ink)}
    .links{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:24px 0 0}
    .links a{display:flex; align-items:center; min-height:48px; padding:0 14px; border:1px solid var(--v-line); border-radius:8px; background:var(--v-paper); color:var(--v-ink); font-size:14px; font-weight:500; text-decoration:none}
    .sel{margin:12px 0 0; padding:12px 14px; border:1px solid var(--v-line); border-radius:10px; background:var(--v-paper)}
    .sel .dh{margin-bottom:6px}
    .sel .go{padding:12px 0 0; border-top:0}
    .more{margin:24px 0 0; border-top:1px solid var(--v-line)}
    .more > details{border-bottom:1px solid var(--v-line)}
    .more > details > summary{display:flex; align-items:baseline; gap:8px; min-height:52px; padding:14px 2px; box-sizing:border-box; cursor:pointer; list-style:none; font-size:15px; font-weight:500; color:var(--v-ink)}
    .more > details > summary::-webkit-details-marker{display:none}
    .more > details > summary::after{content:"›"; margin-left:auto; color:var(--v-mute); transition:transform .15s}
    .more > details[open] > summary::after{transform:rotate(90deg)}
    .more > details > summary span{font-size:13px; font-weight:400; color:var(--v-mute)}
    .more > details > div,.more > details > p{padding-bottom:16px}
    .more h2:first-child{margin-top:0}
    @media (prefers-reduced-motion: reduce){ .more > details > summary::after{transition:none} }
    .fnote{margin:28px 0 0; font-size:12px; line-height:1.6; color:var(--v-mute)}
    .msg{margin:24px 4px; font-size:14px; line-height:1.6; color:var(--v-mute)}
    /* ── 가시성 정리(10/22 사용자): 블록 제목 → 흰 카드, 글자 위계 3단(제목 17 / 본문 15 / 보조 13) ── */
    .fw .sec{margin:28px 2px 10px; font-size:17px; font-weight:700; letter-spacing:-.01em; color:var(--v-ink)}
    .fw .sec:first-child{margin-top:20px}
    .sec-sub{margin:-4px 2px 10px; font-size:13px; color:var(--v-mute)}
    .card,.box{margin:0; border:1px solid var(--v-line); border-radius:12px; background:var(--v-paper)}
    .calcard{padding:8px 10px 12px}
    .calcard .mnav{margin:4px 2px 8px}
    .calcard .mnav b{font-size:17px; font-weight:700}
    .calcard .mnav button{min-width:40px; min-height:40px; border-radius:8px}
    .cal{gap:3px}
    .cal .wd{font-size:12px; font-weight:500}
    .cal button{min-height:62px; padding:5px 2px; border-radius:8px}
    .cal button .dn{font-size:14px; font-weight:500; line-height:18px}
    .cal button.today{background:var(--v-sunken)}
    .cal button.today .dn{color:var(--v-cobalt); font-weight:700}
    .cal button[aria-pressed="true"]{border:2px solid var(--v-cobalt); background:var(--v-cobalt-bg); padding:4px 1px}
    .cal .lb{font-size:12px; font-weight:600; line-height:18px; border-radius:4px}
    .lb.tr{background:var(--v-cobalt); color:#fff}
    .lb.chk{background:var(--v-warn); color:#fff}
    .lb.pl{background:var(--v-cobalt-bg); color:var(--v-cobalt)}
    .cal button .lb[title]{font-size:10.5px; font-weight:600; letter-spacing:-.05em; line-height:17px; padding:0 1px; text-overflow:clip}   /* 학생 칸: 이름 전체 + 시간(사용자: 크기 줄여도 풀네임) */
    .calcard{padding-left:4px; padding-right:4px}
    .cal button[aria-pressed="true"]{border-width:1px; padding:5px 1px; box-shadow:0 0 0 1px var(--v-cobalt)}   /* 고른 날 테두리가 칸 폭을 먹지 않게 */
    .cal button{padding-left:1px; padding-right:1px}
    .cal{gap:2px}   /* 앞으로의 예정 시간 — 지난 인정(진한 파랑)과 구분 */
    .sel{margin-top:12px; padding:16px}
    .sel-h{display:flex; align-items:baseline; flex-wrap:wrap; gap:6px 10px; padding-bottom:12px; margin-bottom:4px; border-bottom:1px solid var(--v-line)}
    .sel-h b{font-size:18px; font-weight:700; color:var(--v-ink)}
    .sel-h .today{font-size:12px; font-weight:700; color:#fff; background:var(--v-cobalt); padding:0 8px; border-radius:10px; line-height:20px}
    .sel-h .meta{width:100%; font-size:13px; color:var(--v-mute)}
    .sel .sr{min-height:56px; margin:0; padding:10px 0; border-radius:0; border-bottom:1px solid var(--v-line)}
    .sel .sr:last-of-type{border-bottom:0}
    .sel .sr .n b{font-size:15px; font-weight:700}
    .sel .sr.off{background:none}
    .sel .sr.tk{margin:10px 0 0; padding:10px 12px; border:0; border-radius:8px; background:var(--v-sunken)}
    .st{flex:none; padding:2px 10px; border-radius:12px; font-size:13px; font-weight:600; line-height:20px; background:var(--v-sunken); color:var(--v-ink)}
    .st.ok{background:var(--v-cobalt-bg); color:var(--v-cobalt)}
    .st.short,.st.none{background:var(--v-warn-bg); color:var(--v-warn)}
    .st.planned{background:none; color:var(--v-mute); border:1px solid var(--v-line)}
    .sel .sr.off .st{background:var(--v-ink); color:var(--v-bg)}
    .sel .go{padding:14px 0 0}
    .bi{padding:14px 16px; gap:12px}
    .bi .k{min-width:52px; padding:3px 6px; font-size:12px}
    .bi .wh b{font-size:15px; font-weight:700}
    .bi .wh span{margin-top:2px; font-size:13px}
    .bi .r{font-size:13px}
    .empty{padding:16px; font-size:14px}
    .more{margin:0; border-top:0; padding:0 16px}
    .more > details:last-child{border-bottom:0}
    .more > details > summary{min-height:56px; font-size:16px; font-weight:700}
    /* 더보기 안 — 능력단위(달 묶음 띠) · 월별 출결 마감/전담인력수당(한 줄씩 + 상태 알약) */
    .more .lede{margin:0 0 12px; font-size:13px}
    .more .chips{margin-bottom:12px}
    .more .grp{margin:4px 0 10px; font-size:13px}
    .mo{display:flex; align-items:baseline; gap:8px; margin:16px 0 0; padding:10px 12px; border-radius:8px; background:var(--v-sunken); font-size:13px; color:var(--v-mute)}
    .mo b{font-size:15px; font-weight:700; color:var(--v-ink)}
    .mo em{margin-left:auto; font-style:normal; font-size:12px; font-weight:700; color:#fff; background:var(--v-cobalt); padding:0 8px; border-radius:10px; line-height:20px}
    .mo.now{background:var(--v-cobalt-bg)} .mo.now b{color:var(--v-cobalt)}
    .unit{padding:12px 12px 12px 14px; border-top:0; border-left:3px solid var(--v-line); margin:8px 0 0 4px}
    .unit:last-child{border-bottom:0}
    .mo.now ~ .unit{border-left-color:var(--v-cobalt)}
    .mo.now ~ .mo:not(.now) ~ .unit{border-left-color:var(--v-line)}
    .unit .t b{font-size:15px; font-weight:700}
    .more .mnav{margin:0 0 10px}
    .more .mnav b{font-size:16px; font-weight:700}
    .more .steps div{font-size:12px; font-weight:500}
    .rows{border-top:1px solid var(--v-line); margin-top:12px}
    .row{display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--v-line)}
    .row:last-child{border-bottom:0}
    .row .l{flex:1; min-width:0}
    .row .l b{display:block; font-size:15px; font-weight:700; color:var(--v-ink)}
    .row .l span{display:block; margin-top:2px; font-size:13px; color:var(--v-mute)}
    .row .rr{flex:none; display:flex; flex-direction:column; align-items:flex-end; gap:4px}
    .row .rr small{font-size:12px; color:var(--v-mute)}
    .pill{display:inline-block; padding:2px 10px; border-radius:12px; font-size:13px; font-weight:600; line-height:20px; white-space:nowrap}
    .pill.ok{background:var(--v-cobalt-bg); color:var(--v-cobalt)}
    .pill.w{background:var(--v-warn-bg); color:var(--v-warn)}
    .pill.dn{background:var(--v-ink); color:var(--v-bg)}
    .pill.mu{border:1px solid var(--v-line); color:var(--v-mute)}
    .links{display:block; margin:16px 0 0; padding:0 16px}
    .links[hidden]{display:none}
    .links a{display:flex; align-items:center; min-height:52px; padding:0; border:0; border-bottom:1px solid var(--v-line); border-radius:0; background:none; font-size:15px; font-weight:500}
    .links a:last-child{border-bottom:0}
    .links a::after{content:"›"; margin-left:auto; color:var(--v-mute)}
    /* 알리기 시트 */
    .veil{position:fixed; inset:0; z-index:9; background:rgba(18,19,24,.45); display:flex; align-items:flex-end; justify-content:center}
    .veil[hidden]{display:none}
    .sheet{width:100%; max-width:560px; max-height:88vh; overflow:auto; padding:18px 16px calc(20px + env(safe-area-inset-bottom)); background:var(--v-bg); border-radius:14px 14px 0 0}
    .sheet h3{margin:0 0 2px; font-size:18px; color:var(--v-ink)}
    .sheet .q{margin:18px 0 8px; font-size:14px; font-weight:700; color:var(--v-ink)}
    .sheet .q span{font-weight:400; color:var(--v-mute)}
    .chips{display:flex; flex-wrap:wrap; gap:8px}
    .chip2{min-height:40px; padding:0 14px; border:1px solid var(--v-line); border-radius:20px; background:var(--v-paper); color:var(--v-ink); font:inherit; font-size:14px; cursor:pointer}
    .chip2[aria-pressed="true"]{border-color:var(--v-cobalt); background:var(--v-cobalt); color:#fff}
    .seg{display:flex; border:1px solid var(--v-line); border-radius:8px; overflow:hidden}
    .seg button{flex:1; min-height:44px; border:0; background:var(--v-paper); color:var(--v-ink); font:inherit; font-size:15px; cursor:pointer}
    .seg button + button{border-left:1px solid var(--v-line)}
    .seg button[aria-pressed="true"]{background:var(--v-ink); color:var(--v-bg); font-weight:700}
    .sheet input{width:100%; box-sizing:border-box; min-height:44px; padding:0 12px; border:1px solid var(--v-line); border-radius:8px; background:var(--v-paper); color:var(--v-ink); font:inherit}
    .sheet .foot{display:flex; gap:8px; margin-top:20px}
    .sheet .foot .btn{flex:1}
    .sheet .sm{margin:12px 0 0; font-size:13px; color:var(--v-mute)}
  </style>
</head>
<body data-tabbar><!-- 기업 담당자 첫 화면(index 가 넘김) — 아래 탭(홈·공지·자료·상담)은 app.js -->
  <header class="fh"><div class="in" id="head"><p class="co">일학습병행 공동훈련센터</p><h1>불러오는 중…</h1></div></header>
  <main class="fw" id="main">
    <!-- (10/22 사용자: 탭이 복잡) 한 화면 — 달력(칸마다 글자: 훈련·휴가·출장·확인·평가·면담) → 고른 날 → 이번 달 할 일 → 더보기 -->
    <!-- (10/22 사용자: 가시성) 블록마다 제목(.sec) + 흰 카드(.card) — 달력·고른 날 / 할 일 / 알린 휴가·출장 / 더보기 -->
    <section id="t-month" hidden>
      <h2 class="sec">훈련 일정</h2>
      <div class="card calcard">
        <div class="mnav"><button type="button" id="m-prev" aria-label="이전 달">‹</button><b id="m-title"></b><button type="button" id="m-next" aria-label="다음 달">›</button></div>
        <div class="cal" id="m-cal"></div>      </div>
      <div id="m-day"></div>
      <h2 class="sec">할 일</h2>
      <div id="m-todo"></div>
      <h2 class="sec">알린 휴가·출장</h2>
      <div id="m-abs"></div>
      <h2 class="sec">더보기</h2>
      <div class="more card">
        <details id="stage-sec" hidden><summary>우리 회사 진행 현황 <span id="stage-now"></span></summary><div id="stage-view"></div></details>
        <details><summary>능력단위 <span>달마다 배우는 내용</span></summary><p class="lede">실시신고 시간표의 달별 배정이에요. 단위를 누르면 능력단위요소·수행과업이 나와요.</p><div id="u-list"></div></details>
        <details><summary>월별 출결 마감 <span>학습일지·출석확인</span></summary><div id="a-view"></div></details>
        <details><summary>전담인력수당 <span>신청 상태</span></summary><div id="w-view"></div></details>
      </div>
    </section>
    <p class="msg" id="msg" hidden></p>
    <!-- (10/22 사용자) '내 학습기업' 칸 뺌 -->
    <nav class="links card" id="links" hidden aria-label="다른 메뉴">
      <a href="./company-survey.html">만족도 조사</a><a href="./faq.html">자주 묻는 질문</a><a href="./install.html">알림 설정</a>
    </nav>
    <p class="fnote" id="foot"></p>
    <p class="fnote" style="margin-top:8px"><a href="./privacy.html" style="color:inherit">개인정보 처리방침</a> · <a href="./index.html?stay=1" style="color:inherit">전체 메뉴</a></p>
  </main>

  <div class="veil" id="veil" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t">
      <h3 id="sh-t">휴가·출장 알리기</h3>
      <p class="lede">알려 주시면 센터가 그 날 훈련을 다른 날로 옮겨요.</p>
      <p class="q">누가 <span>(여러 명 가능)</span></p><div class="chips" id="sh-who"></div>
      <p class="q">언제 <span>(훈련일만, 여러 날 가능)</span></p><div class="chips" id="sh-day"></div>
      <p class="q">무엇</p><div class="seg" id="sh-kind"><button type="button" aria-pressed="true" data-k="leave">휴가</button><button type="button" aria-pressed="false" data-k="trip">출장</button></div>
      <p class="q">메모 <span>(선택)</span></p><input id="sh-note" maxlength="300" placeholder="예: 고객사 현장 지원" />
      <p class="q">알리는 분</p><input id="sh-by" maxlength="40" placeholder="이름 (예: 홍길동 과장)" autocomplete="name" />
      <p class="sm" id="sh-msg"></p>
      <div class="foot"><button type="button" class="btn" id="sh-close">닫기</button><button type="button" class="btn solid" id="sh-ok" disabled>알리기</button></div>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script><!-- 아래 탭 아이콘(다른 화면과 같은 주소) -->
  <script type="module">
    // [sql/70] 우리 학생 OJT — 기업 담당자(앱에 기업 초대코드로 가입한 기기)용. 본인 확인 = 프로필 code(학생과 같은 방식, 사용자 10/22).
    //   현장교사·HRD담당자로 나누지 않고 회사 하나: 이번 달(휴가·출장) · 월별 출결 · 전담인력수당 · 능력단위 · 월말 할 일.
    //   첫 화면 위에 '이번 달 예정 시수·능력단위·월말 할 일' 요약(사용자 10/22). 비콘은 인정 시간·상태만(입실·퇴실 시각은 서버도 안 줌).
    import { supabase, configReady, friendlyError, esc, getProfile, requireCenterId } from './app.js';

    const $ = id => document.getElementById(id);
    const prof = getProfile();
    const CODE = prof.target_type === 'company' ? (prof.code || '') : '';
    const AK = { leave: '휴가', trip: '출장' }, AKRO = { leave: '휴가로', trip: '출장으로' };
    const ST = { ok: '인정', short: '모자람', none: '기록 없음', planned: '예정' };
    const BY_KEY = 'ilhak_company_by';
    const pad = n => String(n).padStart(2, '0');
    const ymAdd = (ym, n) => { const d = new Date(Number(ym.slice(0, 4)), Number(ym.slice(5)) - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
    const W = '일월화수목금토';
    const md = d => `${Number(d.slice(5, 7))}/${Number(d.slice(8, 10))}(${W[new Date(d.slice(0, 10) + 'T00:00:00').getDay()]})`;
    const moName = ym => `${Number(ym.slice(5))}월`;
    const errText = e => /too_many_attempts/.test((e && e.message) || '') ? '잠시 후 다시 시도해 주세요.' : friendlyError(e);
    const unitsOf = s => [...new Set(String(s || '').split('·').map(x => x.trim()).filter(Boolean))];

    let D = null, ym = null, thisYm = null, today = null, selDay = null, EV = [];
    // 센터 일정(행사·특강 등, 전체 대상)·기업 할 일(tasks 기업/전체) — 옛 홈 달력에 있던 것(첫 화면이 이 화면으로 바뀌어 여기로)
    async function loadEvents(m) {
      try {
        const cid = await requireCenterId(), from = m + '-01', to = ymAdd(m, 1) + '-01';
        const [ce, tk] = await Promise.all([
          supabase.from('calendar_events').select('title,event_date,kind,job_key,memo').eq('center_id', cid).gte('event_date', from).lt('event_date', to),
          supabase.from('tasks').select('title,due_date,kind,memo').in('audience', ['기업', '전체']).eq('published', true).eq('center_id', cid).gte('due_date', from).lt('due_date', to),
        ]);
        EV = (ce.data || []).filter(r => !r.job_key).map(r => ({ day: r.event_date, kind: r.kind || '일정', title: r.title, memo: r.memo }))
          .concat((tk.data || []).map(t => ({ day: t.due_date, kind: t.kind || '할 일', title: t.title, memo: t.memo })));
      } catch (_) { EV = []; }
    }

    function fail(msg) {
      $('head').innerHTML = `<a class="back" href="./index.html?stay=1">‹ 전체 메뉴</a><h1>우리 학생 OJT</h1>`;
      document.querySelectorAll('.fw section').forEach(s => { s.hidden = true; });
      $('msg').hidden = false; $('msg').textContent = msg;
    }

    async function load(month) {
      if (!configReady()) { fail('연결 설정이 필요합니다.'); return; }
      if (!CODE) { fail('기업 담당자로 가입한 기기에서 열 수 있어요. 홈에서 기업 초대코드로 가입해 주세요.'); return; }
      const { data, error } = await supabase.rpc('company_home', { p_code: CODE, p_month: month || null });
      if (error) { fail(errText(error)); return; }
      if (!data || !data.ok) { fail('기업 코드를 확인하지 못했어요. 센터 담당 선생님께 문의해 주세요.'); return; }
      D = data; ym = data.month; today = data.today; thisYm = thisYm || today.slice(0, 7);
      await loadEvents(ym);
      $('msg').hidden = true;
      draw();
    }

    // ---------- 공통 계산 ----------
    const studs = () => D.students || [];
    const courseOf = s => ((s.days || []).find(d => d.course) || {}).course || '';
    const multiCourse = () => new Set(studs().map(courseOf).filter(Boolean)).size > 1;
    const monthRow = (s, m) => (s.months || []).find(x => x.month === m) || null;
    const liveAbs = s => (s.absences || []).filter(a => a.state === 'open' || a.state === 'applied');
    const absOn = (s, day) => { const xs = (s.absences || []).filter(a => a.day === day); return xs.find(a => a.state !== 'rejected') || null; };
    // 인정이 정규시간보다 적은 지난 날(휴가·출장 체크가 없는 것만)
    const shorts = () => studs().flatMap(s => (s.days || []).filter(d => (d.status === 'short' || d.status === 'none') && !absOn(s, d.day))
      .map(d => ({ s, d })));
    const openTasks = () => (D.tasks || []).filter(t => !t.done_on);

    function draw() {
      const sh = ym === thisYm ? shorts() : [];
      const fut = studs().flatMap(s => (s.days || []).map(d => d.day)).filter(d => d >= today && d.slice(0, 7) === thisYm);
      const leftDays = new Set(fut).size;
      const unpaid = (D.allowance || []).filter(a => a.state === '미신청');
      // 머리 — 결론 한 줄(수당 미신청이 가장 급함 → 확인 필요한 날 → 남은 훈련일)
      const title = unpaid.length ? `${moName(unpaid[0].period)}분 전담인력수당을 아직 신청하지 않았어요`
        : sh.length ? `확인이 필요한 날이 ${sh.length}건 있어요` : `${moName(thisYm)} 남은 훈련일 ${leftDays}일`;
      $('head').innerHTML = `<p class="co">${esc(D.company)} · 학생 ${studs().length}명</p><h1>${esc(title)}</h1>`;
      $('t-month').hidden = false; $('links').hidden = false;
      $('foot').textContent = `인정 시간은 센터가 매일 아침 행정지원시스템에서 조회한 값이에요(어제까지). 문의는 센터 담당 선생님께.`;
      drawMonth(); drawTodo(sh, unpaid); drawAbs(); drawUnits(); drawAttn(); drawAllow(); drawStage();
    }

    function taskRow(t) {
      const cls = t.done_on ? 'done' : t.kind === '내부평가' ? 'ev' : 'iv';
      const due = t.done_on ? `받음 ${md(t.done_on)}` : t.due_on ? `${md(t.due_on)}까지` : moName(t.month);
      const late = !t.done_on && t.due_on && t.due_on < today;
      return `<div class="bi"><span class="k ${cls}">${esc(t.kind)}</span><span class="wh"><b>${esc(t.title)}</b>` +
        `<span>${t.course && multiCourse() ? esc(t.course) + ' · ' : ''}${t.note ? esc(t.note) : moName(t.month) + '분'}</span></span>` +
        `<span class="r${late ? ' w' : ''}">${late ? '지남 · ' : ''}${esc(due)}</span></div>`;
    }

    // ---------- 달력 — 칸마다 글자: 훈련 / 휴가·출장 / 확인(인정 모자람) / 평가(내부평가) / 면담(면담일지) ----------
    const KL = { '내부평가': '평가', '면담일지': '면담' };
    function dayInfo(ds) {
      const tr = [], off = [];
      studs().forEach(s => (s.days || []).forEach(d => { if (d.day !== ds) return; const a = absOn(s, ds); (a ? off : tr).push({ s, d, a }); }));
      const tasks = (D.tasks || []).filter(t => t.due_on === ds);
      return { tr, off, tasks, evs: EV.filter(e => e.day === ds), chk: ds < today && tr.some(x => x.d.status === 'short' || x.d.status === 'none') };
    }
    function drawMonth() {
      $('m-title').textContent = `${ym.slice(0, 4)}년 ${Number(ym.slice(5))}월`;
      $('m-prev').disabled = ym <= ymAdd(thisYm, -2); $('m-next').disabled = ym >= ymAdd(thisYm, 2);
      const y = Number(ym.slice(0, 4)), m = Number(ym.slice(5)) - 1, first = new Date(y, m, 1).getDay(), last = new Date(y, m + 1, 0).getDate();
      // 고른 날 — 그 달 안에서 유지, 없으면 오늘(이번 달) → 다음 훈련일 → 그 달 첫 훈련일
      const all = [];
      for (let d = 1; d <= last; d++) all.push(`${ym}-${pad(d)}`);
      const busy = all.filter(ds => { const i = dayInfo(ds); return i.tr.length || i.off.length || i.tasks.length || i.evs.length; });
      if (!selDay || selDay.slice(0, 7) !== ym) selDay = (ym === thisYm && busy.includes(today) && today) || busy.find(ds => ds >= today) || busy[0] || (ym === thisYm ? today : all[0]);
      let h = [...W].map((w, i) => `<span class="wd${i === 0 ? ' sun' : ''}">${w}</span>`).join('');
      for (let i = 0; i < first; i++) h += `<button type="button" class="blank" tabindex="-1" aria-hidden="true"></button>`;
      all.forEach((ds, i) => {
        const inf = dayInfo(ds), dow = (first + i) % 7, lbs = [];
        // 훈련한 학생마다 '이름 시간'(사용자 10/22) — 이름은 성까지 다(글자를 줄여서), 지난 날은 인정 시간(모자라면 주황), 앞으로는 예정 시간, 휴가·출장은 회색
        const nick = n => String(n || '').trim();
        inf.tr.concat(inf.off).sort((a, b) => a.s.name.localeCompare(b.s.name, 'ko')).forEach(({ s, d, a }) => {
          if (a) { lbs.push(`<span class="lb off" title="${esc(s.name)} ${AK[a.kind]}">${esc(nick(s.name))} ${AK[a.kind].slice(0, 1)}</span>`); return; }
          const past = d.status === 'ok' || d.status === 'short' || d.status === 'none';
          const hrs = past ? (Number(d.recognized) || 0) : (Number(d.hours) || 0);
          lbs.push(`<span class="lb ${d.status === 'short' || d.status === 'none' ? 'chk' : past ? 'tr' : 'pl'}" title="${esc(s.name)} ${hrs}시간">${esc(nick(s.name))} ${hrs}</span>`);
        });
        inf.evs.forEach(e => lbs.push(`<span class="lb ex">${esc(String(e.kind).slice(0, 2))}</span>`));
        inf.tasks.forEach(t => lbs.push(`<span class="lb ${t.done_on ? 'done' : t.kind === '내부평가' ? 'ev' : 'iv'}">${esc(KL[t.kind] || t.kind)}</span>`));
        const cls = [dow === 0 ? 'sun' : '', ds < today ? 'past' : '', ds === today ? 'today' : ''].filter(Boolean).join(' ');
        const say = `${md(ds)}${lbs.length ? ' ' + lbs.map(x => x.replace(/<[^>]+>/g, '')).join(', ') : ''}`;
        h += `<button type="button" class="${cls}" data-d="${ds}" aria-pressed="${ds === selDay}" aria-label="${esc(say)}"><span class="dn">${i + 1}</span>${lbs.slice(0, 5).join('')}</button>`;
      });
      $('m-cal').innerHTML = h;
      $('m-cal').querySelectorAll('button[data-d]').forEach(b => b.addEventListener('click', () => { selDay = b.dataset.d; drawMonth(); }));
      drawDay();
      $('m-prev').onclick = () => { selDay = null; load(ymAdd(ym, -1)); };
      $('m-next').onclick = () => { selDay = null; load(ymAdd(ym, 1)); };
    }
    // 고른 날 — 훈련 시간, 학생마다 상태, 그날 마감인 할 일, [이 날 휴가·출장 알리기]
    function drawDay() {
      const ds = selDay, inf = dayInfo(ds), rows = inf.tr.concat(inf.off).sort((a, b) => a.s.name.localeCompare(b.s.name, 'ko'));
      const t = rows.length ? rows[0].d : null, mc = multiCourse();
      let h = `<div class="card sel"><div class="sel-h"><b>${md(ds)}</b>${ds === today ? '<span class="today">오늘</span>' : ''}` +
        `${t ? `<span class="meta">${t.start && t.end ? `${esc(t.start)}–${esc(t.end)} · ` : ''}${Number(t.hours) || 0}시간</span>` : ''}</div>`;
      h += inf.tasks.map(k => `<div class="sr tk${k.done_on ? ' done' : ''}"><span class="n"><b>${esc(k.kind)}</b><span>${esc(k.title)}</span></span><span class="st">${k.done_on ? '받음' : '이 날까지'}</span></div>`).join('');
      h += rows.map(({ s, d, a }) => {
        const st = a ? `<span class="st">${AK[a.kind]}${a.state === 'applied' ? ' · 옮김' : ''}</span>`
          : `<span class="st ${d.status}">${d.status === 'ok' || d.status === 'short' ? (Number(d.recognized) || 0) + 'h ' : ''}${ST[d.status] || ''}</span>`;
        // 훈련날엔 그 학생의 그 달 OJT 능력단위(실시신고 시간표 월 배정, 사용자 10/22)
        const us = unitsOf((monthRow(s, ds.slice(0, 7)) || {}).units);
        return `<div class="sr${a ? ' off' : ''}"><span class="n"><b>${esc(s.name)}</b>${mc && d.course ? `<span>${esc(d.course)}</span>` : ''}` +
          `${us.length ? `<small class="u">${esc(us.join(' · '))}</small>` : ''}</span>${st}</div>`;
      }).join('');
      h += inf.evs.map(e => `<div class="sr tk"><span class="n"><b>${esc(e.kind)}</b><span>${esc(e.title)}${e.memo ? ' · ' + esc(e.memo) : ''}</span></span></div>`).join('');
      if (!rows.length && !inf.tasks.length && !inf.evs.length) h += `<p class="lede" style="margin:0">이 날은 OJT 훈련이 없어요.</p>`;
      if (inf.tr.length && ds >= today) h += `<div class="go"><button type="button" class="btn wide" id="day-sheet">이 날 휴가·출장 알리기</button></div>`;
      $('m-day').innerHTML = h + `</div>`;
      $('day-sheet')?.addEventListener('click', () => openSheet(ds));
    }

    // ---------- 이번 달 할 일 — 내부평가·면담일지 마감 · 인정 모자란 날 · 수당 미신청 ----------
    function drawTodo(sh, unpaid) {
      const tasks = (D.tasks || []).filter(t => !t.done_on && t.month <= thisYm).sort((a, b) => ((a.due_on || a.month) < (b.due_on || b.month) ? -1 : 1));
      let h = '';
      h += tasks.map(taskRow).join('');
      if (sh.length) h += `<div class="bi"><span class="k ev" style="background:var(--v-warn)">확인</span><span class="wh"><b>인정 시간이 모자란 날 ${sh.length}건</b>` +
        `<span>${sh.slice(0, 4).map(({ s, d }) => `${md(d.day)} ${esc(s.name)} ${d.status === 'none' ? '기록 없음' : (Number(d.recognized) || 0) + 'h/' + Number(d.hours) + 'h'}`).join(' · ')}${sh.length > 4 ? ` 외 ${sh.length - 4}건` : ''} — 휴가·출장이었다면 알려 주세요</span></span></div>`;
      if (unpaid.length) h += `<div class="bi"><span class="k ev" style="background:var(--v-warn)">수당</span><span class="wh"><b>${unpaid.map(a => moName(a.period) + '분').join(', ')} 전담인력수당 미신청</b><span>아래 '전담인력수당'에서 확인하세요</span></span></div>`;
      $('m-todo').innerHTML = `<div class="box">${h || '<p class="empty">지금은 할 일이 없어요.</p>'}</div>`;
    }
    // 알린 휴가·출장 — 취소 가능. 알리기는 달력에서 날짜를 고른 뒤(아래 버튼은 중복이라 뺌, 사용자 10/22)
    function drawAbs() {
      const list = studs().flatMap(s => liveAbs(s).map(a => ({ s, a }))).filter(x => x.a.day >= ymAdd(thisYm, -1) + '-01').sort((x, y) => (x.a.day < y.a.day ? -1 : 1));
      $('m-abs').innerHTML = `<p class="sec-sub">알려 주시면 센터가 그 날 훈련을 다른 날로 옮겨요.</p><div class="box">` +
        (list.length ? list.map(({ s, a }) => {
          const who = a.by_role === 'company' || a.by_role === 'teacher' ? (a.by_name || '기업 담당자') : a.by_role === 'admin' ? '센터' : '학생 본인';
          return `<div class="bi"><span class="k${a.kind === 'trip' ? ' trip' : ''}">${AK[a.kind]}</span><span class="wh"><b>${md(a.day)} ${esc(s.name)}</b>` +
            `<span>${esc(who)}${a.note ? ' · ' + esc(a.note) : ''}</span></span>` +
            (a.state === 'applied' ? `<span class="r">다른 날로 옮김</span>` : `<button type="button" class="lnk" data-cancel="${esc(a.id)}">취소</button>`) + `</div>`;
        }).join('') : `<p class="empty">아직 없어요. 달력에서 날짜를 누르고 [이 날 휴가·출장 알리기]로 알려 주세요.</p>`) + `</div>`;
      $('m-abs').querySelectorAll('[data-cancel]').forEach(b => b.addEventListener('click', () => cancel(b)));
    }

    // ---------- 알리기 시트 — 학생(여러 명) × 앞으로의 훈련일(여러 날) × 휴가/출장 ----------
    const pick = { who: new Set(), day: new Set(), kind: 'leave' };
    function openSheet(preDay) {   // preDay: 달력에서 고른 날(미리 눌러 둠)
      pick.who.clear(); pick.day.clear(); pick.kind = 'leave';
      const days = [...new Set(studs().flatMap(s => (s.days || []).filter(d => d.day >= today).map(d => d.day)))].sort();
      $('sh-who').innerHTML = studs().map(s => `<button type="button" class="chip2" aria-pressed="false" data-v="${esc(s.id)}">${esc(s.name)}</button>`).join('');
      $('sh-day').innerHTML = days.length ? days.map(d => `<button type="button" class="chip2" aria-pressed="false" data-v="${d}">${md(d)}</button>`).join('')
        : `<p class="lede" style="margin:0">${moName(ym)}에 앞으로 남은 훈련일이 없어요. 위에서 다음 달로 넘긴 뒤 알려 주세요.</p>`;
      const bind = (id, set) => $(id).querySelectorAll('.chip2').forEach(b => b.addEventListener('click', () => {
        const on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', on);
        on ? set.add(b.dataset.v) : set.delete(b.dataset.v); sheetMsg();
      }));
      bind('sh-who', pick.who); bind('sh-day', pick.day);
      if (preDay) { const b = $('sh-day').querySelector(`[data-v="${preDay}"]`); if (b) { b.setAttribute('aria-pressed', true); pick.day.add(preDay); } }
      $('sh-kind').querySelectorAll('button').forEach(b => {
        b.setAttribute('aria-pressed', b.dataset.k === 'leave');
        b.onclick = () => { pick.kind = b.dataset.k; $('sh-kind').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); sheetMsg(); };
      });
      $('sh-note').value = '';
      try { $('sh-by').value = localStorage.getItem(BY_KEY) || ''; } catch (_) { $('sh-by').value = ''; }   // 가입 이름은 기업명이라 사람 이름은 따로
      sheetMsg(); $('veil').hidden = false;
    }
    // 고른 학생 × 날짜 중 그 학생에게 실제 훈련일인 것만
    const pairs = () => studs().filter(s => pick.who.has(s.id)).flatMap(s => [...pick.day].filter(d => (s.days || []).some(x => x.day === d) && !absOn(s, d)).map(d => ({ s, d })));
    function sheetMsg() {
      const n = pairs().length;
      $('sh-msg').textContent = !pick.who.size || !pick.day.size ? '학생과 날짜를 골라 주세요.'
        : n ? `${n}건을 ${AKRO[pick.kind]} 알려요. 같은 과정 학생이 함께 훈련하는 날은 과정 전체가 옮겨질 수 있어요.`
        : '고른 날짜에 그 학생의 훈련이 없거나 이미 알린 날이에요.';
      $('sh-ok').disabled = !n;
    }
    $('sh-close').addEventListener('click', () => { $('veil').hidden = true; });
    $('veil').addEventListener('click', e => { if (e.target === $('veil')) $('veil').hidden = true; });
    $('sh-ok').addEventListener('click', async () => {
      const by = $('sh-by').value.trim();
      if (!by) { $('sh-msg').textContent = '알리는 분 이름을 적어 주세요.'; $('sh-by').focus(); return; }
      try { localStorage.setItem(BY_KEY, by); } catch (_) {}
      $('sh-ok').disabled = true;
      const note = $('sh-note').value.trim(); let okN = 0, bad = [];
      for (const { s, d } of pairs()) {
        try {
          const { data, error } = await supabase.rpc('company_absence', { p_code: CODE, p_student: s.id, p_day: d, p_kind: pick.kind, p_note: note, p_by_name: by });
          if (error || !data || !data.ok) bad.push(`${md(d)} ${s.name}`); else okN++;
        } catch (_) { bad.push(`${md(d)} ${s.name}`); }
      }
      $('veil').hidden = true;
      if (bad.length) alert(`${okN}건은 알렸어요. 다음은 처리하지 못했어요: ${bad.join(', ')}`);
      load(ym);
    });
    async function cancel(b) {
      if (!confirm('이 휴가·출장을 취소할까요?')) return;
      b.disabled = true;
      try {
        const { data, error } = await supabase.rpc('company_absence_cancel', { p_code: CODE, p_id: b.dataset.cancel });
        if (error) alert(errText(error));
        else if (!data || !data.ok) alert(data && data.reason === 'applied' ? '이미 다른 날로 옮긴 날이라 취소할 수 없어요. 센터에 문의해 주세요.' : '처리하지 못했어요.');
      } catch (_) { alert('연결이 불안정해요. 잠시 후 다시 시도해 주세요.'); }
      load(ym);
    }

    // ---------- 능력단위 ----------
    let uSel = null;   // 능력단위 — 학생마다 칸을 나눠 봄(사용자 10/22)
    function drawUnits() {
      const ss = studs();
      if (!ss.some(s => s.id === uSel)) uSel = ss.length ? ss[0].id : null;
      const evMonths = new Map();   // 능력단위 → 내부평가 달(월말 할 일의 제목에 단위 이름이 있으면)
      (D.tasks || []).filter(t => t.kind === '내부평가').forEach(t => evMonths.set(t.title, t.month));
      let h = ss.length > 1 ? `<div class="chips" id="u-who" role="group" aria-label="학생">` +
        ss.map(s => `<button type="button" class="chip2" aria-pressed="${s.id === uSel}" data-v="${esc(s.id)}">${esc(s.name)}</button>`).join('') + `</div>` : '';
      [ss.find(s => s.id === uSel)].filter(Boolean).forEach(s => {
        if (courseOf(s)) h += `<p class="grp">${esc(s.name)} · ${esc(courseOf(s))}</p>`;
        const info = u => (s.units || []).find(x => x.unit === u) || null;
        const months = (s.months || []).filter(m => Number(m.planned) > 0 || m.units);
        if (!months.length) { h += `<p class="msg" style="margin:8px 0">OJT 배정이 아직 없어요.</p>`; return; }
        months.forEach(m => {
          const now = m.month === thisYm;
          h += `<p class="mo${now ? ' now' : ''}"><b>${moName(m.month)}${m.month.slice(0, 4) !== thisYm.slice(0, 4) ? ` (${m.month.slice(0, 4)})` : ''}</b><span>${Number(m.planned) || 0}시간</span>${now ? '<em>이번 달</em>' : ''}</p>`;
          const us = unitsOf(m.units);
          h += us.length ? us.map(u => {
            const i = info(u), els = (i && i.elements) || [];
            const ev = [...evMonths.entries()].find(([t]) => t.includes(u));
            return `<div class="unit"><div class="t"><b>${esc(u)}</b>${i && i.hours != null ? `<span>학습안내서 ${Number(i.hours)}시간</span>` : ''}${ev ? `<span class="tag">내부평가 ${moName(ev[1])}</span>` : ''}</div>` +
              (els.length ? `<details class="el"${now ? ' open' : ''}><summary>능력단위요소 ${els.length}개</summary><ol>` +
                els.map(e => `<li>${esc(e.name)}${(e.tasks || []).length ? `<ul>${e.tasks.map(t => `<li>${esc(t)}</li>`).join('')}</ul>` : ''}</li>`).join('') + `</ol></details>` : '') + `</div>`;
          }).join('') : `<div class="unit"><span class="mu">능력단위 없음</span></div>`;
        });
      });
      $('u-list').innerHTML = h || `<p class="msg">학생이 없어요.</p>`;
      $('u-list').querySelectorAll('#u-who .chip2').forEach(b => b.addEventListener('click', () => { uSel = b.dataset.v; drawUnits(); }));
    }

    // ---------- 월별 출결 — 월 마감 = 학생 앱 완료 체크(학습일지 작성 + 출석결과확인 등록, sql/71 checks) + 센터 확인 ----------
    // 달 = 학생들의 OJT 배정 달(예정>0) 중 이번 달까지
    const ojtMonths = () => [...new Set(studs().flatMap(s => (s.months || []).filter(m => Number(m.planned) > 0 && m.month <= thisYm).map(m => m.month)))].sort();
    // 학습일지·출석확인 완료 = 학생 앱 완료 체크 또는 센터가 넣은 학생 출석확인 날짜(attendance_month_status — 8·9월은 출석결과 엑셀에서, 10/22)
    const checked = (s, m) => (s.checks || []).includes(m) || !!((s.status || []).find(x => x.month === m) || {}).student_confirmed_on;
    const centerOn = (s, m) => ((s.status || []).find(x => x.month === m) || {}).center_confirmed_on || null;
    // 머리 숫자용: 지난달까지 중 가장 최근 달, 그 달 앱 체크 안 한 학생 수
    function latestStatusMonth() { const ms = ojtMonths().filter(m => m < thisYm); return ms.length ? ms[ms.length - 1] : null; }
    const statusRows = m => studs().filter(s => monthRow(s, m)).map(s => ({ s, st: checked(s, m) ? { center_confirmed_on: centerOn(s, m) || 'checked' } : null, mr: monthRow(s, m) }));
    let attnYm = null;
    function drawAttn() {
      const ms = ojtMonths();
      if (!ms.length) { $('a-view').innerHTML = `<h2>월별 출결</h2><p class="msg" style="margin:8px 0">아직 OJT 배정 달이 없어요.</p>`; return; }
      if (!attnYm || !ms.includes(attnYm)) attnYm = latestStatusMonth() || ms[ms.length - 1];
      const i = ms.indexOf(attnYm), m = attnYm, cur = m === thisYm;
      const rows = studs().filter(s => monthRow(s, m)).map(s => ({ s, mr: monthRow(s, m), ok: checked(s, m), cc: centerOn(s, m) }));
      const allOk = rows.length && rows.every(r => r.ok), allCc = rows.length && rows.every(r => r.cc);
      const steps = [['정규시간 등록', true], ['출결', !cur], ['학습일지·출석확인', allOk], ['센터 확인', allCc]];
      const firstNo = steps.findIndex(x => !x[1]);
      const lack = rows.filter(r => !r.ok);
      let h = `<div class="mnav"><button type="button" id="a-prev" aria-label="이전 달"${i <= 0 ? ' disabled' : ''}>‹</button><b>${m.slice(0, 4)}년 ${moName(m)}분</b><button type="button" id="a-next" aria-label="다음 달"${i >= ms.length - 1 ? ' disabled' : ''}>›</button></div>` +
        `<p class="lede">한 달 출결은 아래 순서로 마감돼요. 학생이 고용24에서 학습일지를 쓰고 [출석결과확인 등록]을 누른 뒤 앱에서 완료 체크하면 '완료'로 바뀌어요.</p>` +
        `<div class="steps">${steps.map(([l, d], k) => `<div class="${d ? 'd' : k === firstNo ? 'n' : ''}">${l}</div>`).join('')}</div>`;
      if (!cur && lack.length) h += `<div class="alert"><p><b>${esc(lack.map(r => r.s.name).join(', '))} 학생이 아직 ${moName(m)} 학습일지·출석확인을 마치지 않았어요.</b></p><p>센터도 알림을 보내요. 회사에서도 한 번 알려 주세요.</p></div>`;
      else if (cur) h += `<p class="lede">${moName(m)}분은 다음 달 1일부터 마감해요(마감 ${moName(ymAdd(m, 1))} 3일).</p>`;
      // 학생마다 한 줄(폰에서 4칸 표는 좁아 읽기 어려움 — 사용자 10/22 가시성): 이름·인정/계획 / 오른쪽 학습일지·출석확인 상태 + 센터 확인일
      h += `<div class="rows">` + rows.map(({ s, mr, ok, cc }) => `<div class="row"><div class="l"><b>${esc(s.name)}</b>` +
          `<span>인정 ${mr.actual != null ? Number(mr.actual) : '—'} / 계획 ${Number(mr.planned) || 0}시간${courseOf(s) && multiCourse() ? ' · ' + esc(courseOf(s)) : ''}</span></div>` +
          `<div class="rr"><span class="pill ${ok ? 'ok' : cur ? 'mu' : 'w'}">${ok ? '학습일지 완료' : cur ? '진행 중' : '학습일지 전'}</span>` +
          `<small>${cc ? '센터 확인 완료' : '센터 확인 전'}</small></div></div>`).join('') + `</div>`;   // 날짜는 안 보임(8·9월은 마감 사실만 10/22에 기록)
      $('a-view').innerHTML = h;
      $('a-prev')?.addEventListener('click', () => { attnYm = ms[i - 1]; drawAttn(); });
      $('a-next')?.addEventListener('click', () => { attnYm = ms[i + 1]; drawAttn(); });
    }

    // ---------- 전담인력수당 — OJT 배정 달마다 한 줄(센터가 아직 확인 안 한 달은 '확인 전') ----------
    // ---------- 우리 회사 진행 현황 — 옛 첫 화면 카드(index renderCompanyStage)와 같은 내용. RPC·데이터 없으면 안 보임 ----------
    let stageDone = false;
    async function drawStage() {
      if (stageDone) return; stageDone = true;   // 달을 넘겨도 다시 부르지 않음
      let cs = null;
      try { const res = await supabase.rpc('my_company_stage', { p_company: D.company || prof.company }); if (!res.error) cs = res.data; } catch (_) {}
      const STAGES = window.COMPANY_STAGES || [];
      const idx = cs ? STAGES.findIndex(s => s.key === cs.stage_key) : -1;
      if (idx < 0) return;
      $('stage-now').textContent = STAGES[idx].label;
      $('stage-view').innerHTML = `<div class="stage-list">` + STAGES.map((s, i) => {
        const cls = i < idx ? 'done' : i === idx ? 'now' : 'todo';
        const dot = i < idx ? '<i data-lucide="check"></i>' : i === idx ? '<i data-lucide="play"></i>' : '';
        const memo = i === idx && cs.memo ? `<div class="stage-s">${esc(cs.memo)}</div>` : '';
        const line = i < STAGES.length - 1 ? '<span class="stage-line"></span>' : '';
        return `<div class="stage-item ${cls}"><span class="stage-col"><span class="stage-dot">${dot}</span>${line}</span>` +
          `<div class="stage-body"><div class="stage-t">${esc(s.label)}${i === idx ? ' <span class="mju-badge">진행 중</span>' : ''}</div>${memo}</div></div>`;
      }).join('') + `</div>`;
      $('stage-sec').hidden = false;
      window.lucide?.createIcons();
    }

    function drawAllow() {
      const al = D.allowance || [], by = {}; al.forEach(a => { by[a.period] = a; });
      const months = [...new Set(ojtMonths().concat(al.map(a => a.period)))].sort().reverse();
      const un = al.filter(a => a.state === '미신청');
      const lastCheck = al.reduce((x, a) => (a.checked_at && a.checked_at > x ? a.checked_at : x), '');
      // 제목은 더보기 줄에 있으니 안내만, 달마다 한 줄 + 상태 알약(미신청 주황 · 신청~확정 파랑 · 지급완료 진함 · 확인 전 회색)
      let h = `<p class="lede">OJT 출결이 있는 달마다 신청할 수 있어요. 상태는 센터가 행정지원시스템에서 확인한 값이에요${lastCheck ? `(${md(lastCheck)} 확인)` : ''}. 순서: 신청 → 승인 → 확정 → 지급완료</p>`;
      if (un.length) h += `<div class="alert" style="margin:0 0 12px"><p><b>${un.map(a => moName(a.period) + '분').join(', ')} 아직 신청 안 됨</b></p><p>그 달 OJT 출결이 있어 신청 대상이에요. 신청 방법은 센터 담당 선생님께 문의해 주세요.</p></div>`;
      const PILL = { '미신청': 'w', '신청': 'ok', '승인': 'ok', '확정': 'ok', '지급완료': 'dn' };
      h += months.length ? `<div class="rows">` + months.map(m => {
            const a = by[m]; const st = a ? a.state : m === thisYm ? '출결 진행 중' : '확인 전';
            return `<div class="row"><div class="l"><b>${m.slice(0, 4) !== thisYm.slice(0, 4) ? m.slice(0, 4) + '년 ' : ''}${moName(m)}분</b>` +
              `<span>${a && a.applied_on ? '신청일 ' + md(a.applied_on) : '신청일 —'}</span></div>` +
              `<div class="rr"><span class="pill ${PILL[st] || 'mu'}">${esc(st)}</span></div></div>`; }).join('') + `</div>`
        : `<p class="msg" style="margin:8px 0">아직 OJT 배정 달이 없어요.</p>`;
      $('w-view').innerHTML = h;
    }

    load();
  </script>
</body>
</html>
