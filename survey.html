<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>만족도 조사 · 일학습병행 앱</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#fafaf8" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./student.css" /><!-- 학생 화면 디자인(관리자와 같은 계열) -->
  <script src="./config.js"></script>
  <style>
    /* 보기(라디오/체크박스) — company-survey와 동일한 카드형 보기 */
    .opt{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;margin-top:7px;
      border:1.5px solid var(--border-default);border-radius:11px;background:var(--surface-card);
      cursor:pointer;font-weight:600;font-size:14px;color:var(--text-secondary);line-height:1.5;transition:.12s}
    .opt input{width:18px;height:18px;margin:1px 0 0;flex-shrink:0;accent-color:var(--accent)}
    .opt:has(input:checked){border-color:var(--accent);background:var(--tint-bg);color:var(--tint-fg)}
    .q-block{margin-top:22px}
    .q-block .field-label{line-height:1.55}
    .etc-input{margin-top:7px;display:none}
    .q-block.miss .field-label{color:var(--danger-500)}
    .sv-item{display:block;padding:14px;border:1.5px solid var(--border-default);border-radius:13px;
      background:var(--surface-card);margin-top:10px;text-decoration:none;color:inherit}
    .sv-item.done{opacity:.55}
    .sv-item b{font-size:15px}
  </style>
</head>
<body>
  <div class="app">
    <header class="ph-header">
      <img class="wm" src="./assets/logo-mono-white.png" alt="" />
      <div class="ph-lockup"><img src="./assets/logo-mono-white.png" alt="" /><span>일학습병행 공동훈련센터</span></div>
      <div class="ph-title-row"><a class="ph-back" href="./index.html" aria-label="뒤로"><i data-lucide="chevron-left"></i></a><h1 class="ph-title">만족도 조사</h1></div>
      <p class="ph-sub"><span id="who"></span> 센터 운영 개선을 위한 자체 설문</p>
    </header>
    <main class="ph-body">
      <!-- 설문 목록 -->
      <div class="card" id="list">
        <div class="mju-alert mju-alert--info">
          <span class="mju-alert__icon">i</span>
          <div class="mju-alert__body">
            <div class="mju-alert__title">센터 자체 설문</div>
            <div class="mju-alert__text">공단 공식 만족도와 별개, 익명 집계</div>
          </div>
        </div>
        <div id="sv-list"><p class="note" style="margin-top:12px">설문을 불러오는 중...</p></div>
      </div>
      <!-- 응답 폼 (?id=) -->
      <div class="card" id="form" style="display:none">
        <p class="ph-card-title" id="f-title"></p>
        <p class="ph-note" id="f-desc" style="display:none"></p>
        <div id="questions"></div>
        <div class="q-block" id="comment-block">
          <span class="field-label">하고 싶은 말 (선택)</span>
          <textarea id="comment" class="ph-ta" rows="3" placeholder="자유롭게 작성해주세요"></textarea>
        </div>
        <button class="mju-btn mju-btn--full" id="submit" style="margin-top:16px">제출하기</button>
        <div class="status" id="status"></div>
      </div>
      <div class="card accent" id="done" style="display:none;text-align:center">
        <span class="ei" style="margin:0 auto 10px"><i data-lucide="check"></i></span>
        <p class="ph-card-title">제출 완료</p>
        <p class="ph-note">소중한 의견 감사합니다.</p>
      </div>
      <a href="./index.html" class="mju-btn mju-btn--secondary mju-btn--full" id="homeBtn" style="margin-top:auto">홈으로</a>
    </main>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script type="module">
    import { supabase, configReady, setStatus, friendlyError, esc, matchSel, requireCenterId, centerRequiredMessage } from './app.js';
    import { renderQuestions, collectAnswers } from './survey-ui.js';
    if (window.lucide) window.lucide.createIcons();
    const $ = id => document.getElementById(id);
    let profile = {}; try { profile = JSON.parse(localStorage.getItem('ilhak_profile') || '{}'); } catch (_) {}
    $('who').textContent = profile.name ? `${profile.name}님 ·` : '';

    // 내 정보 없는 기기 — 대상 필터를 적용할 수 없어 안내만
    if (!profile.name) {
      $('list').innerHTML = '<span class="ei" style="margin:0 auto 10px"><i data-lucide="user"></i></span><p class="ph-card-title" style="text-align:center">내 정보 필요</p><p class="ph-note" style="text-align:center">가입(또는 내 정보 불러오기) 후 참여 가능</p><a href="./index.html" class="mju-btn mju-btn--secondary mju-btn--full" style="margin-top:14px">홈에서 정보 입력하기</a>';
      window.lucide?.createIcons();
    }

    // 기기 식별값(랜덤, PII 아님) — 서버측 1인1표(설문별)용
    const deviceId = (() => {
      try { let d = localStorage.getItem('ilhak_device_id'); if (!d) { d = 'dev_' + Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('ilhak_device_id', d); } return d; }
      catch (_) { return null; }
    })();
    const answered = id => { try { return !!localStorage.getItem('ilhak_esurvey_' + id); } catch (_) { return false; } };
    const visible = s => s.target_scope === 'all' || (() => { try { return matchSel(JSON.parse(s.target_value || '{}'), profile, true); } catch (_) { return false; } })();

    const svId = new URLSearchParams(location.search).get('id');
    let current = null;

    async function loadList() {
      if (!profile.name) return;
      if (!configReady()) { $('sv-list').innerHTML = '<p class="note">Supabase 연결이 필요합니다.</p>'; return; }
      const cid = await requireCenterId().catch(() => null);
      if (!cid) { $('sv-list').innerHTML = '<p class="note">' + esc(centerRequiredMessage()) + '</p>'; return; }
      const sq = supabase.from('surveys').select('id,title,description,target_scope,target_value,created_at').eq('open', true).eq('center_id', cid);
      const { data, error } = await sq.order('created_at', { ascending: false });
      const el = $('sv-list');
      if (error) {
        el.innerHTML = '<p class="note">' + (/relation|does not exist|schema cache/i.test(error.message || '') ? '설문 기능이 아직 준비 중이에요. (관리자: sql/16 실행 필요)' : '설문을 불러오지 못했어요 — ' + esc(error.message)) + '</p>';
        return;
      }
      const rows = (data || []).filter(visible);
      if (!rows.length) { el.innerHTML = '<p class="note" style="margin-top:12px">지금 참여할 수 있는 설문 없음</p>'; return; }
      el.innerHTML = '';
      rows.forEach(s => {
        const did = answered(s.id);
        const a = document.createElement('a');
        a.className = 'sv-item' + (did ? ' done' : '');
        a.href = did ? '#' : ('./survey.html?id=' + s.id);
        a.innerHTML = `<b>${esc(s.title)}</b>${did ? ' <span class="mju-badge mju-badge--success">참여 완료</span>' : ''}` +
          (s.description ? `<div class="note" style="margin-top:4px">${esc(s.description)}</div>` : '') +
          `<div class="note" style="margin-top:4px">${new Date(s.created_at).toLocaleDateString('ko-KR')}</div>`;
        if (did) a.addEventListener('click', e => e.preventDefault());
        el.appendChild(a);
      });
    }

    async function loadForm() {
      $('list').style.display = 'none'; $('form').style.display = 'block';
      const cid = await requireCenterId().catch(() => null);
      if (!cid) {
        $('form').innerHTML = '<p class="ph-card-title">안내</p><p class="ph-note">' + esc(centerRequiredMessage()) + '</p><a href="./survey.html" class="mju-btn mju-btn--secondary mju-btn--full" style="margin-top:12px">설문 목록으로</a>';
        return;
      }
      const sfq = supabase.from('surveys').select('id,title,description,target_scope,target_value,questions').eq('id', svId).eq('center_id', cid);
      const { data, error } = await sfq.maybeSingle();
      if (error || !data) {
        $('form').innerHTML = '<p class="ph-card-title">안내</p><p class="ph-note">설문을 찾을 수 없거나 마감된 설문</p><a href="./survey.html" class="mju-btn mju-btn--secondary mju-btn--full" style="margin-top:12px">설문 목록으로</a>';
        return;
      }
      current = data;
      if (!visible(data)) {
        $('form').innerHTML = '<p class="ph-card-title">안내</p><p class="ph-note">다른 대상을 위한 설문</p><a href="./survey.html" class="mju-btn mju-btn--secondary mju-btn--full" style="margin-top:12px">설문 목록으로</a>';
        return;
      }
      if (answered(data.id)) {
        $('form').style.display = 'none'; $('homeBtn').style.display = 'none'; $('done').style.display = 'block';
        window.lucide?.createIcons(); return;
      }
      $('f-title').textContent = data.title;
      if (data.description) { $('f-desc').textContent = data.description; $('f-desc').style.display = 'block'; }
      renderQuestions($('questions'), data.questions || []);
    }

    $('submit').addEventListener('click', async () => {
      if (!current) return;
      const answers = collectAnswers($('questions'), current.questions || [], $('status'));
      if (!answers) return;
      if (!configReady()) { setStatus($('status'), 'Supabase 연결이 필요합니다.', 'error'); return; }
      $('submit').disabled = true; setStatus($('status'), '제출 중...', 'info');
      const { data, error } = await supabase.rpc('submit_survey_answer', {
        p_survey: current.id,
        p_answers: answers,
        p_comment: $('comment').value.trim().slice(0, 2000) || null,
        p_job_key: profile.job_key || null,
        p_device_id: deviceId
      });
      $('submit').disabled = false;
      // 23505 = 이 기기가 이 설문에 이미 제출(서버측 유일 제약) → 정상 처리
      if ((data && data.ok === false) || (error && error.code !== '23505')) {
        if (data && data.reason === 'closed') { setStatus($('status'), '마감된 설문이에요.', 'error'); return; }
        setStatus($('status'), friendlyError(error), 'error'); return;
      }
      try { localStorage.setItem('ilhak_esurvey_' + current.id, '1'); } catch (_) {}
      $('form').style.display = 'none'; $('homeBtn').style.display = 'none'; $('done').style.display = 'block';
      window.lucide?.createIcons();
    });

    if (svId) loadForm(); else loadList();
  </script>
</body>
</html>
