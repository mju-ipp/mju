<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="referrer" content="no-referrer" />
  <meta name="robots" content="noindex, nofollow" />
  <title>휴가·출장 체크 · 현장교사</title>
  <meta name="theme-color" content="#fafaf8" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./student.css" /><!-- 학생 화면 디자인(관리자와 같은 계열) -->
  <script src="./config.js"></script>
  <style>
    .fd-intro{margin:0 4px 14px; font-size:14px; line-height:1.6; color:var(--v-mute)}
    .fd-intro b{font-weight:600; color:var(--v-ink)}
    .fd-who{display:flex; align-items:center; gap:8px; margin:0 0 14px; padding:10px 12px; border:1px solid var(--v-line); border-radius:8px; background:var(--v-paper)}
    .fd-who label{flex:none; font-size:13px; font-weight:600; color:var(--v-ink)}
    .fd-who input{flex:1; min-width:0; padding:8px 10px; font:inherit; font-size:14px; color:var(--v-ink); background:var(--v-bg); border:1px solid var(--v-line); border-radius:6px}
    .fd-nav{display:flex; align-items:center; justify-content:space-between; margin:0 0 6px}
    .fd-nav b{font-size:16px; color:var(--v-ink)}
    .fd-nav button{min-width:44px; min-height:40px; border:1px solid var(--v-line); border-radius:6px; background:var(--v-paper); color:var(--v-ink); font:inherit; font-size:16px; cursor:pointer}
    .fd-nav button:disabled{opacity:.4; cursor:default}
    .fd-sum{margin:0 4px 10px; font-size:13px; color:var(--v-mute)}
    .fd-day{padding:12px 0; border-top:1px solid var(--v-line)}
    .fd-day.past .fd-d{color:var(--v-mute)}
    .fd-d{margin:0 4px 6px; font-size:15px; font-weight:700; color:var(--v-ink)}
    .fd-d small{margin-left:6px; font-size:13px; font-weight:500; color:var(--v-mute)}
    .fd-row{display:flex; align-items:center; gap:8px; min-height:48px; padding:6px 4px}
    .fd-n{flex:1; min-width:0}
    .fd-n b{display:block; font-size:15px; font-weight:600; color:var(--v-ink)}
    .fd-n span{display:block; font-size:12px; color:var(--v-mute)}
    .fd-st{flex:none; font-size:13px; font-weight:600; color:var(--v-cobalt); text-align:right}
    .fd-st small{display:block; font-size:12px; font-weight:500; color:var(--v-mute)}
    .fd-st.done{color:var(--v-mute)}
    .fd-b{flex:none; min-height:40px; padding:0 12px; font:inherit; font-size:14px; font-weight:600; border-radius:6px; cursor:pointer;
      color:var(--v-cobalt); background:var(--v-paper); border:1px solid var(--v-cobalt)}
    .fd-b.x{color:var(--v-ink); border-color:var(--v-line)}
    .fd-b:disabled{opacity:.5; cursor:default}
    .fd-empty{margin:24px 4px; font-size:14px; line-height:1.6; color:var(--v-mute)}
  </style>
</head>
<body>
  <div class="app">
    <header class="ph-header">
      <img class="wm" src="./assets/logo-mono-white.png" alt="" />
      <div class="ph-lockup"><img src="./assets/logo-mono-white.png" alt="" /><span>일학습병행 공동훈련센터</span></div>
      <div class="ph-title-row"><h1 class="ph-title">휴가·출장 체크</h1></div>
      <p class="ph-sub" id="sub">현장교사용</p>
      <hr class="ph-gold" />
    </header>

    <main class="ph-body">
      <p class="fd-intro">학생이 <b>휴가·출장</b>으로 OJT를 못 하는 날을 체크해 주세요. 센터 선생님이 그 날 훈련을 다른 날로 옮깁니다.
        같은 과정 학생이 여럿이면 한 명만 빠져도 <b>그 날은 과정 전체가</b> 옮겨져요.</p>
      <div class="fd-who"><label for="who">체크하는 분</label><input id="who" maxlength="40" placeholder="이름 (예: 홍길동 과장)" autocomplete="name" /></div>
      <div id="view"></div>
      <div class="status" id="st"></div>
    </main>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script type="module">
    // [sql/69] 현장교사 휴가·출장 체크 — 로그인 없음. 기업 링크(field.html#k=<64자>)로 그 기업 학생만.
    // 링크는 # 뒤에 둬서 서버·다른 사이트로 가지 않게(referrer 도 끔). 옛 ?k= 주소도 읽음.
    // 체크하는 분 이름은 이 기기에만 기억(localStorage) — 서버에는 체크할 때 by_name 으로만 감.
    import { supabase, configReady, friendlyError, esc } from './app.js';

    const $ = id => document.getElementById(id);
    const K = (new URLSearchParams(location.hash.slice(1)).get('k') || new URLSearchParams(location.search).get('k') || '').trim();
    const AK = { leave: '휴가', trip: '출장' }, AKRO = { leave: '휴가로', trip: '출장으로' };
    const WHO_KEY = 'ilhak_field_name';
    const pad = n => String(n).padStart(2, '0');
    const now = new Date();
    const today = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
    const ymAdd = (ym, n) => { const d = new Date(Number(ym.slice(0, 4)), Number(ym.slice(5)) - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
    const thisYm = today.slice(0, 7), minYm = ymAdd(thisYm, -1), maxYm = ymAdd(thisYm, 2);   // 지난달 ~ 두 달 뒤
    let ym = thisYm, plan = null, busy = false;

    try { $('who').value = localStorage.getItem(WHO_KEY) || ''; } catch (_) {}
    $('who').addEventListener('change', () => { try { localStorage.setItem(WHO_KEY, $('who').value.trim()); } catch (_) {} });

    const dayLabel = ds => { const d = new Date(ds + 'T00:00:00'); return `${d.getMonth() + 1}월 ${d.getDate()}일 (${'일월화수목금토'[d.getDay()]})`; };
    const errText = e => /too_many_attempts/.test((e && e.message) || '') ? '잠시 후 다시 시도해주세요.' : friendlyError(e);
    const fail = msg => { $('view').innerHTML = `<p class="fd-empty">${msg}</p>`; };

    async function load() {
      if (!configReady()) { fail('연결 설정이 필요합니다.'); return; }
      if (K.length < 32) { fail('링크가 올바르지 않아요. 센터 담당 선생님께 받은 링크로 다시 열어 주세요.'); return; }
      const { data, error } = await supabase.rpc('company_plan', { p_link: K, p_month: ym });
      if (error) { fail(esc(errText(error))); return; }
      if (!data || !data.ok) { fail('링크가 끊겼거나 기한이 지났어요. 센터 담당 선생님께 새 링크를 받아 주세요.'); return; }
      plan = data;
      $('sub').textContent = `${data.company} · 현장교사용`;
      draw();
    }

    function draw() {
      const y = Number(ym.slice(0, 4)), m = Number(ym.slice(5));
      const studs = plan.students || [];
      const courses = new Set(studs.flatMap(s => s.days.map(d => d.course)).filter(Boolean));
      // 날짜 → [{ 학생, 그날 정규시간, 체크 }]
      const byDay = {};
      studs.forEach(s => {
        const ab = {}; (s.absences || []).forEach(a => { if (!ab[a.day] || ab[a.day].state === 'rejected') ab[a.day] = a; });   // 반려 뒤 다시 체크한 건이 앞섬
        s.days.forEach(d => { (byDay[d.day] = byDay[d.day] || []).push({ s, d, a: ab[d.day] || null }); });
      });
      const days = Object.keys(byDay).sort();
      const nAbs = studs.reduce((n, s) => n + (s.absences || []).filter(a => a.state === 'open' || a.state === 'applied').length, 0);
      let h = `<div class="fd-nav"><button type="button" id="prev" aria-label="이전 달"${ym <= minYm ? ' disabled' : ''}>‹</button>` +
        `<b>${y}년 ${m}월</b><button type="button" id="next" aria-label="다음 달"${ym >= maxYm ? ' disabled' : ''}>›</button></div>`;
      h += `<p class="fd-sum">OJT 훈련일 ${days.length}일 · 학생 ${studs.length}명${nAbs ? ` · 체크 ${nAbs}건` : ''}</p>`;
      if (!days.length) h += `<p class="fd-empty">이 달에는 등록된 OJT 훈련일이 없어요.</p>`;
      days.forEach(ds => {
        const it = byDay[ds].sort((a, b) => a.s.name.localeCompare(b.s.name, 'ko'));
        const t = it[0].d;
        h += `<section class="fd-day${ds < today ? ' past' : ''}"><p class="fd-d">${dayLabel(ds)}<small>${t.start && t.end ? `${esc(t.start)}–${esc(t.end)} · ` : ''}${Number(t.hours) || 0}시간</small></p>`;
        it.forEach(({ s, d, a }) => {
          const sub = courses.size > 1 && d.course ? `<span>${esc(d.course)}</span>` : '';
          let right;
          if (a && a.state === 'applied') right = `<span class="fd-st done">${AK[a.kind]}<small>다른 날로 옮김</small></span>`;
          else if (a && a.state === 'open') {
            const who = a.by_role === 'teacher' ? (a.by_name || '현장교사') : '학생 본인';
            right = `<span class="fd-st">${AK[a.kind]}<small>${esc(who)} 체크</small></span>` +
              `<button type="button" class="fd-b x" data-cancel="${esc(a.id)}">취소</button>`;
          } else {
            right = `<button type="button" class="fd-b" data-s="${esc(s.id)}" data-d="${ds}" data-k="leave" data-n="${esc(s.name)}">휴가</button>` +
              `<button type="button" class="fd-b" data-s="${esc(s.id)}" data-d="${ds}" data-k="trip" data-n="${esc(s.name)}">출장</button>`;
          }
          h += `<div class="fd-row"><span class="fd-n"><b>${esc(s.name)}</b>${sub}</span>${right}</div>`;
        });
        h += `</section>`;
      });
      $('view').innerHTML = h;
      $('prev').addEventListener('click', () => { ym = ymAdd(ym, -1); load(); });
      $('next').addEventListener('click', () => { ym = ymAdd(ym, 1); load(); });
      $('view').querySelectorAll('.fd-b[data-k]').forEach(b => b.addEventListener('click', () => report(b)));
      $('view').querySelectorAll('.fd-b[data-cancel]').forEach(b => b.addEventListener('click', () => cancel(b)));
    }

    const reasonText = r => r === 'applied' ? '이미 다른 날로 옮긴 날이라 바꿀 수 없어요. 센터에 문의해 주세요.'
      : r === 'no_day' ? '그 날은 OJT 훈련일이 아니에요.'
      : r === 'student' ? '이 기업 학생이 아니에요.'
      : r === 'rate' ? '잠시 후 다시 시도해 주세요.' : '처리하지 못했어요. 잠시 후 다시 시도해 주세요.';

    async function report(b) {
      if (busy) return;
      const who = $('who').value.trim();
      if (!who) { alert('체크하는 분 이름을 먼저 적어 주세요.'); $('who').focus(); return; }
      const note = prompt(`${b.dataset.n} · ${dayLabel(b.dataset.d)}을 ${AKRO[b.dataset.k]} 체크할까요?\n메모가 있으면 적어 주세요(선택).`, '');
      if (note === null) return;
      busy = true; b.disabled = true;
      try { localStorage.setItem(WHO_KEY, who); } catch (_) {}
      try {
        const { data, error } = await supabase.rpc('company_report_absence', {
          p_link: K, p_student: b.dataset.s, p_day: b.dataset.d, p_kind: b.dataset.k, p_note: note, p_by_name: who });
        if (error) alert(errText(error));
        else if (!data || !data.ok) alert(data && data.reason ? reasonText(data.reason) : '링크가 끊겼거나 기한이 지났어요.');
      } catch (_) { alert('연결이 불안정해요. 잠시 후 다시 시도해 주세요.'); }
      busy = false;
      load();
    }

    async function cancel(b) {
      if (busy || !confirm('이 체크를 취소할까요?')) return;
      busy = true; b.disabled = true;
      try {
        const { data, error } = await supabase.rpc('company_cancel_absence', { p_link: K, p_id: b.dataset.cancel });
        if (error) alert(errText(error));
        else if (!data || !data.ok) alert(reasonText(data && data.reason));
      } catch (_) { alert('연결이 불안정해요. 잠시 후 다시 시도해 주세요.'); }
      busy = false;
      load();
    }

    load();
    window.lucide?.createIcons();
    window.addEventListener('hashchange', () => location.reload());   // 다른 기업 링크로 바꿔 열면 그 링크로 다시
  </script>
</body>
</html>
