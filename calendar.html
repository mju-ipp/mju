<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>일정 · 일학습병행 앱</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#002968" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
  <script src="./config.js"></script>
</head>
<body>
  <div class="app">
    <header class="ph-header">
      <img class="wm" src="./assets/logo-mono-white.png" alt="" />
      <div class="ph-lockup"><img src="./assets/logo-mono-white.png" alt="" /><span>일학습병행 공동훈련센터</span></div>
      <div class="ph-title-row"><a class="ph-back" href="./index.html" aria-label="뒤로"><i data-lucide="chevron-left"></i></a><h1 class="ph-title">일정</h1></div>
      <p class="ph-sub" id="who"></p>
    </header>
    <main class="ph-body">
      <div class="card" id="calCard" style="display:none;padding:14px">
        <!-- [개편 6단계] 내 정규 훈련시간(my_attendance_days, sql/55) — 이번 달만, 자료 없으면 요약·범례는 안 보임 -->
        <div class="ojt-sum" id="ojt-sum" hidden></div>
        <div class="cal-head">
          <button class="cal-nav" id="cal-prev" aria-label="이전 달"><i data-lucide="chevron-left"></i></button>
          <b id="cal-title"></b>
          <button class="cal-nav" id="cal-next" aria-label="다음 달"><i data-lucide="chevron-right"></i></button>
        </div>
        <div class="cal-grid" id="cal-dow"></div>
        <div class="cal-grid" id="cal-cells"></div>
        <div class="ojt-legend" id="ojt-legend" hidden><span><i class="sw"></i>내 훈련 날</span><span class="ojt-st ok">인정</span><span class="ojt-st short">모자람</span><span class="ojt-st none">기록 없음</span></div>
        <p class="note" style="margin:8px 0 0;text-align:center" id="cal-help">점이 있는 날짜를 누르면 아래 목록이 그 날짜로 좁혀져요.</p>
      </div>
      <div class="filter-chips" id="chips" style="display:none" role="group" aria-label="일정 종류 필터"></div>
      <div id="ojt-day"></div>
      <div id="list"></div>
      <div id="empty" class="empty-state" style="display:none">
        <span class="ei"><i data-lucide="calendar-days"></i></span>
        <div class="et">예정된 일정이 없습니다</div>
        <p class="es" id="emptyMsg">새로운 일정이 등록되면 여기에 표시됩니다.</p>
      </div>
      <a href="./index.html" class="mju-btn mju-btn--secondary mju-btn--full" style="margin-top:auto;text-decoration:none">홈으로</a>
    </main>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script type="module">
    import { supabase, configReady, esc, getProfile, matchSel, skeletonList, clearSkeleton, requireCenterId, centerRequiredMessage } from './app.js';
    if (window.lucide) window.lucide.createIcons();

    const profile = getProfile();
    document.getElementById('who').textContent = profile.name ? `${profile.name}님 일정` : '';

    const visible = (r) => {
      if (!r.job_key) return true;                                   // 전체
      if (r.job_key.indexOf('custom:') === 0) { try { return matchSel(JSON.parse(r.job_key.slice(7)), profile); } catch (_) { return false; } }
      return r.job_key === profile.job_key;                          // 단일 직무(기존)
    };
    // 종류는 중립 태그(텍스트로 구분), 색 신호는 D-day(시간 긴급도)가 담당 — '무지개 배지' 절제
    const KIND_BADGE = { '외부평가': 'mju-badge--neutral', '마감': 'mju-badge--neutral', 'OT': 'mju-badge--neutral', '특강': 'mju-badge--neutral', '행사': 'mju-badge--neutral', '기타': 'mju-badge--neutral' };

    // D-day 계산 (로컬 자정 기준)
    function dday(dateStr) {
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const d = new Date(dateStr + 'T00:00:00');
      const diff = Math.round((d - today) / 86400000);
      if (diff === 0) return { label: 'D-DAY', color: '#c1121f' };
      if (diff > 0) return { label: 'D-' + diff, color: diff <= 7 ? '#c1121f' : '#1f4e8c' };
      return { label: '종료', color: '#94a3b8' };
    }
    const fmtDate = (s) => { try { return new Date(s + 'T00:00:00').toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' }); } catch (_) { return s; } };

    const listEl = document.getElementById('list');
    const chipsEl = document.getElementById('chips');
    const pad = n => String(n).padStart(2, '0');
    const now = new Date();
    const todayStr = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
    const weekAgo = new Date(now); weekAgo.setDate(weekAgo.getDate() - 7);
    const weekAgoStr = `${weekAgo.getFullYear()}-${pad(weekAgo.getMonth() + 1)}-${pad(weekAgo.getDate())}`;   // [TASKS v2 Q2] 지난 마감 노출 창
    let all = [], kindSel = '', daySel = '';
    let ojt = null;   // [개편 6단계] { ym, fetched, byDay } — 이번 달 내 정규 훈련시간
    let calY = now.getFullYear(), calM = now.getMonth();             // 표시 중인 달
    let loadedFrom = null;                                            // 가장 이른 조회 시작일
    const minD = new Date(now.getFullYear(), now.getMonth() - 3, 1); // 과거 3개월까지만
    const monthStart = (y, m) => { const d = new Date(y, m, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-01`; };

    // [개편 6단계] 고른 날짜가 내 훈련 날이면 목록 위에 정규시간·인정·입퇴실
    const OJT_LABEL = { ok: '인정', short: '모자람', none: '기록 없음', planned: '예정' };
    function renderOjtDay() {
      const box = document.getElementById('ojt-day');
      const r = daySel && ojt && ojt.byDay[daySel];
      if (!r) { box.innerHTML = ''; return; }
      const io = (r.in || r.out) ? `입실 ${esc(r.in || '기록 없음')} · 퇴실 ${esc(r.out || '기록 없음')}` : '';
      const rec = r.status === 'planned' ? '아직 전이에요' : `${Number(r.recognized) || 0}시간 인정 <span class="ojt-st ${r.status}">${OJT_LABEL[r.status] || ''}</span>`;
      box.innerHTML = `<div class="card ojt-daycard"><p class="ph-card-title" style="margin:0 0 6px">${fmtDate(daySel)} 내 훈련</p>` +
        `<p class="ph-note" style="margin:0">정규시간 <b>${esc(r.start)}–${esc(r.end)}</b> · ${Number(r.planned)}시간</p>` +
        `<p class="ph-note" style="margin:4px 0 0">${rec}${io ? ' · ' + io : ''}</p>` +
        (r.status === 'short' || r.status === 'none' ? `<p class="ph-note" style="margin:4px 0 0">출석 기록이 모자란 날이에요. 처리 방법은 담당자가 안내하고, 궁금하면 상담으로 물어봐 주세요.</p>` : '') + `</div>`;
    }
    function renderList() {
      renderOjtDay();
      const shown = all.filter(r =>
        (!kindSel || r.kind === kindSel) &&
        (daySel ? r.event_date === daySel : (r.event_date >= todayStr || (r.is_task && r.event_date >= weekAgoStr))));   // 지난 마감 할 일은 7일까지 노출(Q2)
      listEl.innerHTML = '';
      const em = document.getElementById('empty');
      if (!shown.length) {
        // 내 훈련 날만 있고 센터 일정은 없는 날 — 빈 상태 안내는 띄우지 않음
        em.style.display = (daySel && ojt && ojt.byDay[daySel]) ? 'none' : 'block';
        document.getElementById('emptyMsg').textContent = daySel ? '이 날짜에 해당하는 센터 일정이 없습니다.' : (kindSel ? '이 종류의 예정된 일정이 없습니다.' : '예정된 센터 일정이 없습니다.');
        return;
      }
      em.style.display = 'none';
      shown.forEach(r => {
        const dd = dday(r.event_date);
        const badgeCls = KIND_BADGE[r.kind] || 'mju-badge--neutral';
        // 지난 마감 할 일은 '종료' 대신 '지남 D+n' — 놓친 마감을 놓친 줄 알게(Q2)
        const overdueTask = r.is_task && r.event_date < todayStr;
        const ddLabel = overdueTask ? '지남 D+' + Math.round((new Date(todayStr + 'T00:00:00') - new Date(r.event_date + 'T00:00:00')) / 86400000) : dd.label;
        const ddClass = overdueTask ? 'dday urgent' : (dd.label === '종료' ? 'dday muted' : (dd.color === '#c1121f' ? 'dday urgent' : 'dday'));
        const safeLink = (r.link && /^https?:\/\//i.test(r.link)) ? r.link : null;
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML =
          `<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px">` +
          `<span class="mju-badge ${badgeCls}">${esc(r.kind)}</span>` +
          `<span class="${ddClass}">${ddLabel}</span></div>` +
          `<p class="ph-card-title" style="margin:0 0 2px">${esc(r.title)}</p>` +
          `<p class="notice-card-time" style="margin:2px 0 0">${fmtDate(r.event_date)}${r.memo ? ' · ' + esc(r.memo) : ''}</p>` +
          (safeLink ? `<a class="tlink" href="${encodeURI(safeLink)}" target="_blank" rel="noopener">바로가기 ↗</a>` : '');
        listEl.appendChild(card);
      });
      window.lucide?.createIcons();
    }
    function syncChips() { // 리빌드 없이 상태만 갱신 — 포커스·aria 낭독 보존
      [...chipsEl.children].forEach(b => {
        const on = b.dataset.val === kindSel;
        b.classList.toggle('on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
    }
    function buildChips() {
      const kinds = [...new Set(all.map(r => r.kind).filter(Boolean))];
      if (kinds.length < 2) { chipsEl.style.display = 'none'; return; }
      chipsEl.innerHTML = '';
      const mk = (label, val) => {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'chip'; b.textContent = label; b.dataset.val = val;
        b.addEventListener('click', () => { kindSel = val; syncChips(); renderList(); });
        chipsEl.appendChild(b);
      };
      mk('전체', '');
      kinds.forEach(k => mk(k, k));
      syncChips();
      chipsEl.style.display = 'flex';
    }

    // ── 월간 달력 그리드 ──
    function renderCal() {
      document.getElementById('calCard').style.display = 'block';
      document.getElementById('cal-title').textContent = `${calY}년 ${calM + 1}월`;
      const dowEl = document.getElementById('cal-dow');
      if (!dowEl.children.length) ['일', '월', '화', '수', '목', '금', '토'].forEach(d => { const s = document.createElement('span'); s.className = 'cal-dow'; s.textContent = d; dowEl.appendChild(s); });
      const byDate = {};
      all.forEach(r => { (byDate[r.event_date] = byDate[r.event_date] || []).push(r); });
      const first = new Date(calY, calM, 1), days = new Date(calY, calM + 1, 0).getDate();
      const cells = document.getElementById('cal-cells');
      cells.innerHTML = '';
      for (let i = 0; i < first.getDay(); i++) cells.appendChild(document.createElement('span'));
      for (let d = 1; d <= days; d++) {
        const ds = `${calY}-${pad(calM + 1)}-${pad(d)}`;
        const evts = byDate[ds] || [];
        const tr = ojt && ojt.byDay[ds];   // 내 훈련 날(이번 달만)
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'cal-cell' + (evts.length ? ' has' : '') + (tr ? ' ojt' : '') + (ds < todayStr ? ' past' : '') + (ds === todayStr ? ' today' : '') + (ds === daySel ? ' sel' : '');
        b.innerHTML = `<span>${d}</span>`
          + (tr ? `<span class="ojt-t">${esc((tr.start || '').slice(0, 2))}–${esc((tr.end || '').slice(0, 2))}</span>` : '')
          + (tr && tr.status !== 'planned' ? `<span class="ojt-st ${tr.status}">${tr.status === 'none' ? '없음' : (Number(tr.recognized) || 0) + 'h'}</span>` : '')
          + `<span class="cal-dots">${evts.slice(0, 3).map(() => '<span class="cal-dot"></span>').join('')}</span>`;
        if (evts.length || tr) {
          b.setAttribute('aria-label', `${calM + 1}월 ${d}일` + (tr ? ` 내 훈련 ${tr.start}–${tr.end}` + (tr.status !== 'planned' ? ` ${OJT_LABEL[tr.status]}` : '') : '') + (evts.length ? ` 일정 ${evts.length}건` : ''));
          b.addEventListener('click', () => { daySel = (daySel === ds) ? '' : ds; renderCal(); renderList(); });
        } else b.disabled = true;
        cells.appendChild(b);
      }
      const isOjtMonth = !!(ojt && ojt.ym === `${calY}-${pad(calM + 1)}`);
      document.getElementById('ojt-legend').hidden = !isOjtMonth;
      document.getElementById('ojt-sum').hidden = !isOjtMonth;
      document.getElementById('cal-help').textContent = isOjtMonth ? '날짜를 누르면 그날 내 훈련과 일정이 아래에 보여요.' : '점이 있는 날짜를 누르면 아래 목록이 그 날짜로 좁혀져요.';
      const prevStart = new Date(calY, calM - 1, 1);
      document.getElementById('cal-prev').disabled = prevStart < minD;
    }
    async function moveMonth(delta) {
      const d = new Date(calY, calM + delta, 1);
      if (d < minD) return;
      calY = d.getFullYear(); calM = d.getMonth(); daySel = '';
      const from = monthStart(calY, calM);
      if (loadedFrom && from < loadedFrom) await loadAll(from);
      renderCal(); renderList();
    }
    document.getElementById('cal-prev').addEventListener('click', () => moveMonth(-1));
    document.getElementById('cal-next').addEventListener('click', () => moveMonth(1));

    async function loadAll(fromStr) {
      const cid = await requireCenterId();
      const cq = supabase.from('calendar_events').select('title,event_date,kind,job_key,memo').gte('event_date', fromStr).eq('center_id', cid);
      const { data, error } = await cq.order('event_date', { ascending: true });
      if (error) { console.error(error); return false; }
      all = (data || []).filter(visible);
      // 나에게만 지정된 일정(명단 지정) — 토큰으로 서버에서 받아 병합 (범위 RPC 우선, 미적용이면 기존 RPC)
      if (profile.token) {
        let mine = null;
        try {
          const r = await supabase.rpc('my_targeted_calendar_from', { p_token: profile.token, p_from: fromStr });
          if (r.error && /function|does not exist|PGRST202|42883|schema cache/i.test(r.error.message || '')) {
            const r2 = await supabase.rpc('my_targeted_calendar', { p_token: profile.token });
            if (!r2.error) mine = r2.data;
          } else if (!r.error) mine = r.data;
        } catch (_) {}
        if (Array.isArray(mine) && mine.length) {
          const seen = new Set(all.map(r => r.title + '|' + r.event_date));
          mine.forEach(r => { if (!seen.has(r.title + '|' + r.event_date)) all.push(r); });
        }
      }
      // [TASKS v2 Step 4] 할 일(tasks) 병합 — 홈(index.html)과 동일 규칙(audience 가시성). 마감일 있는 것만(달력 특성상).
      //   홈과 일정 화면의 목록 불일치 해소. 체크 버튼은 홈 전용(행동 화면 일원화).
      try {
        const aud = profile.target_type === 'company' ? ['기업', '전체'] : ['매칭학생', '전체'];
        const { data: tasks, error: terr } = await supabase.from('tasks')
          .select('title,kind,link,memo,due_date')
          .in('audience', aud).eq('published', true).eq('center_id', cid).not('due_date', 'is', null)
          .gte('due_date', fromStr)
          .order('due_date', { ascending: true });
        if (!terr && Array.isArray(tasks)) {
          const seen = new Set(all.map(r => r.title + '|' + r.event_date));
          tasks.forEach(t => {
            if (!seen.has(t.title + '|' + t.due_date)) {
              all.push({ title: t.title, event_date: t.due_date, kind: t.kind || '할 일', memo: t.memo, link: t.link, is_task: true });
              seen.add(t.title + '|' + t.due_date);
            }
          });
        }
      } catch (_) {}
      all.sort((a, b) => (a.event_date < b.event_date ? -1 : a.event_date > b.event_date ? 1 : 0));
      loadedFrom = fromStr;
      return true;
    }

    // [개편 6단계] 내 정규 훈련시간 — 학생만, 코드 또는 서명토큰(my_attendance 와 같은 본인 확인). RPC 없거나 자료 없으면 조용히 없음
    async function loadOjt() {
      if (profile.target_type !== 'student' || (!profile.code && !profile.token)) return;
      try {
        const res = await supabase.rpc('my_attendance_days', { p_code: profile.code || null, p_token: profile.token || null });
        const d = res.data;
        if (res.error || !d || d.ok !== true || !Array.isArray(d.days) || !d.days.length) return;
        const byDay = {}; d.days.forEach(r => { byDay[r.day] = r; });
        ojt = { ym: d.month, fetched: d.fetched_at, byDay };
        let reg = 0, rec = 0, total = 0;
        d.days.forEach(r => { total += Number(r.planned) || 0; if (r.status && r.status !== 'planned') { reg += Number(r.planned) || 0; rec += Number(r.recognized) || 0; } });
        const next = d.days.find(r => r.day >= todayStr && r.status === 'planned');
        const fd = s => { const x = new Date(s + 'T00:00:00'); return `${x.getMonth() + 1}/${x.getDate()}(${'일월화수목금토'[x.getDay()]})`; };
        let ft = ''; try { const f = new Date(d.fetched_at); if (!isNaN(f)) ft = `${f.getMonth() + 1}/${f.getDate()} ${pad(f.getHours())}:${pad(f.getMinutes())} 조회`; } catch (_) {}
        document.getElementById('ojt-sum').innerHTML =
          `<div class="ojt-big"><b>${rec}</b><span>/ ${reg}시간 인정 · ${Number(d.month.slice(5))}월 등록 ${total}시간</span></div>`
          + (next ? `<p class="ph-note" style="margin:4px 0 0">다음 훈련 <b>${fd(next.day)} ${esc(next.start)}–${esc(next.end)}</b></p>` : '')
          + (ft ? `<p class="ph-note" style="margin:2px 0 0;font-size:12px">${ft} · 정규시간이 바뀌면 다음 조회 때 반영돼요</p>` : '');
      } catch (_) {}
    }

    (async () => {
      if (!configReady()) { document.getElementById('empty').style.display = 'block'; return; }
      skeletonList(listEl, 3);
      const ok = await loadAll(monthStart(calY, calM)).catch((e) => {
        if (e && (e.code === 'CENTER_REQUIRED' || /center_required/i.test(e.message || ''))) {
          document.getElementById('emptyMsg').textContent = centerRequiredMessage();
        }
        return false;
      });
      clearSkeleton(listEl);
      if (!ok) {
        const e = document.getElementById('empty'); e.style.display = 'block';
        const msg = document.getElementById('emptyMsg');
        if (!msg.textContent || msg.textContent === '새로운 일정이 등록되면 여기에 표시됩니다.') msg.textContent = '일시적 오류로 불러오지 못했습니다. 잠시 후 새로고침해주세요.';
        return;
      }
      await loadOjt();
      renderCal();
      if (!all.length && !ojt) {
        const em = document.getElementById('empty'); em.style.display = 'block';
        if (!profile.name) document.getElementById('emptyMsg').innerHTML = '내 정보가 이 기기에 없어 맞춤 일정이 안 보일 수 있어요.<br/><a href="./index.html">홈에서 정보 입력하기</a>';
        window.lucide?.createIcons();
        return;
      }
      buildChips();
      renderList();
      window.lucide?.createIcons();
    })();
  </script>
</body>
</html>
